<title>Split the Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one scrolling page (people, dishes, tip & tax, totals) with a pinned live-totals bar. Cool white ground, indigo accent, vivid-but-refined person colors. */
:root {
  --bg: #f4f6fc;
  --surface: #ffffff;
  --surface-2: #eaeefa;
  --ink: #131a33;
  --muted: #5b6685;
  --line: #dce2f3;
  --accent: #3d5afe;
  --accent-ink: #ffffff;
  --accent-soft: #e0e6ff;
  --warn: #d9480f;
  --warn-soft: #ffe9dd;
  --ok: #0e9f6e;
  --pl: 47%;
  --ps: 68%;
  --pt: #ffffff;
  --shadow: 0 1px 2px rgba(19,26,51,.05), 0 8px 22px rgba(61,90,254,.08);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1226; --surface: #161d38; --surface-2: #202849; --ink: #eef1ff; --muted: #9ba6d0; --line: #2b3562;
    --accent: #8c9eff; --accent-ink: #0d1226; --accent-soft: #28326b; --warn: #ffa45c; --warn-soft: #3d2a18; --ok: #4fd8a1;
    --pl: 66%; --ps: 78%; --pt: #0d1226; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1226; --surface: #161d38; --surface-2: #202849; --ink: #eef1ff; --muted: #9ba6d0; --line: #2b3562;
    --accent: #8c9eff; --accent-ink: #0d1226; --accent-soft: #28326b; --warn: #ffa45c; --warn-soft: #3d2a18; --ok: #4fd8a1;
    --pl: 66%; --ps: 78%; --pt: #0d1226; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    color-scheme: dark;
}
* { box-sizing: border-box; }
body { overflow-x: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.4; padding-inline: 16px; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body, button, input { touch-action: manipulation; }
input, button { font-size: max(16px, 1em); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
#app { max-width: 600px; margin: 0 auto; padding-block: 18px 150px; }
section.blk { margin-top: 30px; scroll-margin-top: 12px; }
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
h2 { font: 800 24px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; }
.hint { color: var(--muted); font-size: 13px; }
.sec { font: 700 12px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top h1 { font: 800 32px/1 var(--f-display); letter-spacing: -.03em; margin: 0; }
.top p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
.rightcol { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
.resetbtn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font: 700 13px var(--f-body); color: var(--muted); transition: background .2s, color .2s, border-color .2s; }
.resetbtn.arm { background: var(--warn); border-color: var(--warn); color: #fff; }
.billpill { text-align: right; flex: none; }
.billpill small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.billpill b { font: 500 22px var(--f-mono); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* avatars */
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; background: hsl(var(--h) var(--ps) var(--pl)); color: var(--pt); font: 700 14px var(--f-body); }
.av.lg { width: 40px; height: 40px; font-size: 17px; }

/* people */
.pp { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; gap: 12px; }
.round { width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-ink); font: 700 26px/1 var(--f-body); display: grid; place-items: center; transition: transform .15s, opacity .2s; }
.round:active { transform: scale(.88); }
.round:disabled { opacity: .3; cursor: default; }
.num { font: 800 46px/1 var(--f-display); min-width: 1.3ch; text-align: center; font-variant-numeric: tabular-nums; }
.bump { animation: bump .3s cubic-bezier(.3,1.6,.5,1); }
@keyframes bump { 0% { transform: scale(.8); } 100% { transform: scale(1); } }
.ppl { color: var(--muted); font-size: 14px; flex: 1; min-width: 120px; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
.namebox { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 14px; padding: 5px 8px 5px 5px; animation: pop .35s cubic-bezier(.3,1.5,.5,1) both; min-width: 0; }
.namebox input { flex: 1; min-width: 0; font: 500 16px var(--f-body); background: transparent; color: var(--ink); border: none; outline: none; padding: 6px 2px; }
.namebox:focus-within { box-shadow: 0 0 0 2px var(--accent); }
@keyframes pop { from { opacity: 0; transform: scale(.9) translateY(6px); } to { opacity: 1; transform: none; } }

/* dishes */
.progress { margin-bottom: 12px; }
.progress .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; gap: 8px; }
.progress .row b { color: var(--ink); }
.track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.dish { padding: 14px; transition: border-color .25s; }
.dish.done { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.dname { font: 700 17px var(--f-display); min-width: 0; overflow-wrap: anywhere; }
.qty { font: 500 12px var(--f-mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 2px; }
.dprice { font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: flex; align-items: center; gap: 6px; padding: 4px 11px 4px 4px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 14px; font-weight: 500; transition: transform .15s, background .2s, border-color .2s; max-width: 100%; }
.chip .av { width: 26px; height: 26px; font-size: 12px; }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 11ch; }
.chip:active { transform: scale(.92); }
.chip[aria-pressed="true"] { background: hsl(var(--h) var(--ps) var(--pl) / .16); border-color: hsl(var(--h) var(--ps) var(--pl)); animation: bump .3s cubic-bezier(.3,1.6,.5,1); }
.chip.all { padding: 4px 14px; color: var(--muted); }
.chip.all[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.split { margin-top: 10px; }
.bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--line); gap: 2px; }
.bar i { display: block; height: 100%; background: hsl(var(--h) var(--ps) var(--pl)); transition: width .35s cubic-bezier(.2,.8,.2,1); min-width: 0; }
.sline { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.sline.warn { color: var(--warn); font-weight: 500; margin-top: 0; }
.linkbtn { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 13px; padding: 6px 2px; }
.sliders { display: grid; gap: 12px; margin-top: 6px; padding-top: 12px; border-top: 1px dashed var(--line); animation: pop .3s both; }
.srow .lab { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; font-size: 14px; font-weight: 500; }
.srow .lab .pc { margin-left: auto; font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.srow .lab .am { font: 400 12px var(--f-mono); color: var(--muted); min-width: 6ch; text-align: right; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; --c: var(--accent); }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: linear-gradient(to right, var(--c) var(--p,0%), var(--line) var(--p,0%)); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--c); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c); margin-top: -10px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c); }

/* tip & tax */
.big { font: 500 36px/1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tiprow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tipnote { color: var(--muted); font-size: 13px; }
.presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.presets button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 11px 0; font: 700 15px var(--f-body); transition: transform .15s, background .2s, border-color .2s; }
.presets button:active { transform: scale(.94); }
.presets button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.field { display: flex; align-items: center; gap: 10px; }
.field label { color: var(--muted); font-size: 14px; flex: 1; }
.money { display: flex; align-items: center; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 12px; width: 140px; }
.money:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.money span { color: var(--muted); font-family: var(--f-mono); }
.money input { border: none; background: transparent; color: var(--ink); font: 500 18px var(--f-mono); padding: 10px 6px; touch-action: manipulation; width: 100%; min-width: 0; outline: none; text-align: right; }
.switch { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: none; padding: 2px 0; }
.switch .txt { flex: 1; min-width: 0; }
.switch .txt b { display: block; font-weight: 700; }
.switch .txt small { color: var(--muted); font-size: 13px; }
.tg { width: 52px; height: 32px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .25s; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
.switch[aria-checked="true"] .tg { background: var(--accent); }
.switch[aria-checked="true"] .tg::after { transform: translateX(20px); }
hr { border: none; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }

/* totals */
.tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.pcard { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; padding: 14px; border-top: 5px solid hsl(var(--h) var(--ps) var(--pl)); animation: pop .45s cubic-bezier(.3,1.4,.5,1) both; min-width: 0; }
.pcard .who { font: 700 16px var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .owes { grid-column: 1 / -1; font: 500 34px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 6px; }
.pcard .brk { grid-column: 1 / -1; display: flex; gap: 4px 12px; flex-wrap: wrap; font: 400 12px var(--f-mono); color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.check { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); padding: 3px 2px; flex-wrap: wrap; }
.check b { font: 500 15px var(--f-mono); color: var(--ink); }
.check.bad b { color: var(--warn); }
.check.good b { color: var(--ok); }
.primary { width: 100%; border: none; border-radius: 16px; padding: 15px; background: var(--accent); color: var(--accent-ink); font: 700 16px var(--f-body); transition: transform .15s; }
.primary:active { transform: scale(.97); }
.mini { grid-column: 1 / -1; margin-top: 10px; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 9px; font: 700 13px var(--f-body); }
.mini:active { transform: scale(.97); }
.ghost { width: 100%; border: 1.5px solid var(--line); border-radius: 16px; padding: 13px; background: var(--surface); font: 700 15px var(--f-body); }
.ghost:active { transform: scale(.98); }
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font: 700 14px var(--f-body); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: transform .15s, background .2s; }
.tab:active { transform: scale(.95); }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab.new { border-style: dashed; color: var(--accent); background: transparent; }
.billname { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.billname label { color: var(--muted); font-size: 13px; flex: none; }
.textin { flex: 1; min-width: 0; width: 100%; font: 500 16px var(--f-body); background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; outline: none; }
.textin:focus, .qtybox input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.addrow2 { display: flex; gap: 10px; align-items: center; }
.addrow2 .money { width: auto; flex: 1; }
.qtybox { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.qtybox input { width: 64px; text-align: center; font: 500 18px var(--f-mono); background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 4px; outline: none; }
.dright { display: flex; align-items: center; gap: 10px; flex: none; }
.del { flex: none; width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--surface-2); color: var(--muted); font: 700 18px/1 var(--f-body); display: grid; place-items: center; align-self: center; }
.del:active { transform: scale(.88); }
.empty { text-align: center; color: var(--muted); padding: 22px 16px; }
.copybox { margin: 0; white-space: pre-wrap; font: 400 13px var(--f-mono); background: var(--surface-2); border-radius: 12px; padding: 12px; margin-top: 10px; max-height: 360px; overflow: auto; }

/* pinned live totals */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(19,26,51,.1); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
.dockin { max-width: 600px; margin: 0 auto; padding-inline: 16px; }
.dstat { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.dstat .left { color: var(--warn); }
.dstat .left.ok { color: var(--ok); }
.pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: none; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 14px; padding: 6px 12px 6px 6px; }
.pill .nm { display: block; font-size: 11px; color: var(--muted); max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill b { font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

<div id="app">
  <header class="top">
    <div><h1>Split the Check</h1><p id="meta"></p></div>
    <div class="rightcol"><button class="resetbtn" id="reset">Reset</button><div class="billpill"><small>Bill total</small><b id="billtotal">$0.00</b></div></div>
  </header>

  <section class="blk" id="sBills" style="margin-top:18px"></section>
  <section class="blk" id="sPeople"></section>
  <section class="blk" id="sDishes"></section>
  <section class="blk" id="sTip"></section>
  <section class="blk" id="sTotals"></section>
</div>

<div class="dock" aria-label="Live totals"><div class="dockin">
  <div class="dstat"><span>Who owes</span><span class="left" id="dleft"></span></div>
  <div class="pills" id="pills"></div>
</div></div>

<script>
(function () {
  "use strict";
  var HUES = [224, 350, 160, 32, 272, 328, 190, 88, 14, 245, 130, 305];
  // Receipt lines for the James bill, prices in cents
  function jamesItems() {
    return [
      ["Creamed Spinach", 1, 1500], ["Tomahawk", 1, 18500], ["Tanqueray", 1, 1700], ["Caviar Bump", 4, 11200],
      ["Tableside Martini", 2, 6600], ["Caesar", 1, 1900], ["Add Chicken", 1, 1200], ["Burger", 1, 2900],
      ["Weekly Pasta (special)", 1, 3600], ["Michelob Ultra Light", 1, 900], ["Save the Robots IPA", 1, 1000], ["Sticky Toffee Cake", 1, 1500]
    ].map(function (r, i) { return { id: i, name: r[0], qty: r[1], price: r[2], shares: {}, open: false }; });
  }
  var KEY = "split-the-check-v2", OLDKEY = "split-the-check-the-james-v1";
  function freshS(kind) {
    var f = { n: 4, names: ["", "", "", ""], taxCents: 0, taxFollows: true, tipFollows: true, tipMode: "pct", tipPct: 20, tipAmtCents: 0, shareWho: "all" };
    if (kind === "james") { f.taxCents = 4594; f.tipMode = "amt"; f.tipAmtCents = 12000; }
    return f;
  }
  function newBill(kind, title, id) { return { id: id, kind: kind, title: title, S: freshS(kind), items: kind === "james" ? jamesItems() : [], next: kind === "james" ? 12 : 0 }; }
  var bills = [newBill("james", "The James", 1)], cur = 0, nextBillId = 2;
  var S = bills[0].S, items = bills[0].items;
  function bind() { S = bills[cur].S; items = bills[cur].items; shown = {}; }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ v: 2, cur: cur, nextBillId: nextBillId, bills: bills.map(function (b) {
        return { id: b.id, kind: b.kind, title: b.title, next: b.next, S: b.S, items: b.items.map(function (i) { return { id: i.id, name: i.name, qty: i.qty, price: i.price, shares: i.shares, open: i.open }; }) };
      }) }));
    } catch (e) {}
  }
  function cleanS(raw, kind) {
    var f = freshS(kind); raw = raw || {};
    Object.keys(f).forEach(function (k) { if (raw[k] !== undefined && typeof raw[k] === typeof f[k]) f[k] = raw[k]; });
    f.names = (Array.isArray(raw.names) ? raw.names : f.names).map(String).map(function (x) { return x.slice(0, 14); });
    f.n = Math.max(1, Math.min(12, Math.round(f.n))); while (f.names.length < f.n) f.names.push("");
    if (f.tipMode !== "pct" && f.tipMode !== "amt") f.tipMode = "pct";
    f.taxCents = Math.max(0, Math.round(f.taxCents) || 0); f.tipAmtCents = Math.max(0, Math.round(f.tipAmtCents) || 0); f.tipPct = Math.max(0, Math.min(100, f.tipPct));
    f.shareWho = typeof raw.shareWho === "number" && raw.shareWho >= 0 && raw.shareWho < f.n ? Math.round(raw.shareWho) : "all";
    return f;
  }
  function cleanShares(x, n) {
    var o = {}, sum = 0;
    Object.keys((x && x.shares) || {}).forEach(function (k) { var v = +x.shares[k]; if (+k >= 0 && +k < n && v >= 0 && v <= 100) { o[+k] = Math.round(v); sum += o[+k]; } });
    return sum === 100 ? o : {};
  }
  function load() { // restore the last session on this device, ignoring anything malformed
    try {
      var d = JSON.parse(localStorage.getItem(KEY) || "null");
      if (d && d.v === 2 && Array.isArray(d.bills) && d.bills.length) {

    var HEAD = 330, GAP = 20, rowsH = rows.length ? rows.reduce(function (a, it) { return a + it._h + GAP; }, 0) : 140;
    var tot = who === "all" ? c.totals.length * 74 + 150 : 5 * 66 + 30;
    var H = HEAD + 40 + rowsH + 20 + tot + 120;
    var cv = document.createElement("canvas"); cv.width = W; cv.height = H; var g = cv.getContext("2d");
    function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
    function text(t, x, y, font, color, align) { g.font = font; g.fillStyle = color; g.textAlign = align || "left"; g.textBaseline = "alphabetic"; g.fillText(t, x, y); }
    function fit(t, font, maxW) { g.font = font; while (t.length > 1 && g.measureText(t).width > maxW) t = t.slice(0, -2) + "…"; return t; }
    g.fillStyle = "#f4f6fc"; g.fillRect(0, 0, W, H);
    // header band
    g.fillStyle = ACC; rr(0, 0, W, HEAD, 0); g.fill();
    text(fit(billHead(false).toUpperCase(), "700 28px " + SANS, IW), P, 78, "700 28px " + SANS, "rgba(255,255,255,.8)");
    var title = who === "all" ? "Check split" : fit(nm(who) + " owes", "800 60px " + SANS, IW);
    text(title, P, 160, "800 60px " + SANS, "#fff");
    text(money(who === "all" ? c.grand : c.totals[who]), P, 270, "500 108px " + MONO, "#fff");
    if (who === "all") text("bill total", P + 640, 270, "500 34px " + SANS, "rgba(255,255,255,.8)");
    // dishes
    var y = HEAD + 40;
    if (!rows.length) { text("No dishes assigned yet", W / 2, y + 80, "500 34px " + SANS, MUTED, "center"); y += 140; }
    rows.forEach(function (it) {
      g.fillStyle = "#fff"; rr(P, y, IW, it._h, 28); g.fill(); g.strokeStyle = LINE; g.lineWidth = 2; g.stroke();
      var mine = who === "all" ? 0 : it.price * it.shares[who] / 100;
      text(fit(it.name + (it.qty > 1 ? " ×" + it.qty : ""), "700 36px " + SANS, IW - 330), P + 28, y + 52, "700 36px " + SANS, INK);
      text(who === "all" ? money(it.price) : money(Math.round(mine)), P + IW - 28, y + 52, "500 36px " + MONO, INK, "right");
      if (who !== "all") text(it.shares[who] + "% of " + money(it.price), P + 28, y + 92, "400 26px " + MONO, MUTED);
      // segmented bar
      var bx = P + 28, bw = IW - 56, by = y + it._bo, ids = sharesOf(it).sort(function (a, b) { return a - b; }), cx = bx;
      g.save(); rr(bx, by, bw, 30, 15); g.clip(); g.fillStyle = LINE; g.fillRect(bx, by, bw, 30);
      ids.forEach(function (p) { var w = bw * it.shares[p] / 100; g.fillStyle = col(p); g.fillRect(cx, by, w - (p === ids[ids.length - 1] ? 0 : 3), 30); cx += w; });
      g.restore();
      // legend
      it._lg.forEach(function (line, li) {
        var lx = bx, ly = y + it._bo + 66 + li * 40;
        line.forEach(function (m) { g.fillStyle = col(m.p); g.beginPath(); g.arc(lx + 11, ly - 9, 11, 0, 6.2832); g.fill(); text(m.label, lx + 30, ly, "600 26px " + SANS, who !== "all" && m.p === who ? INK : MUTED); lx += m.w; });
      });
      y += it._h + GAP;
    });
    // totals card
    y += 20; g.fillStyle = "#fff"; rr(P, y, IW, tot, 28); g.fill(); g.strokeStyle = LINE; g.lineWidth = 2; g.stroke();
    var ty = y + 68, L = P + 28, R = P + IW - 28;
    if (who === "all") {
      c.totals.forEach(function (v, i) { g.fillStyle = col(i); g.beginPath(); g.arc(L + 16, ty - 12, 16, 0, 6.2832); g.fill(); text(fit(nm(i), "600 34px " + SANS, 560), L + 48, ty, "600 34px " + SANS, INK); text(money(v), R, ty, "500 36px " + MONO, INK, "right"); ty += 74; });
      g.fillStyle = LINE; g.fillRect(L, ty - 36, IW - 56, 2);
      text("Food " + money(c.sub) + " · Tax " + money(c.tax) + " · Tip " + money(c.tip), L, ty + 18, "400 26px " + MONO, MUTED);
    } else {
      [["Food", c.food[who], ""], ["Tax", c.taxO[who], S.taxFollows ? "in proportion to food" : "split evenly"], ["Tip", c.tipO[who], S.tipFollows ? "in proportion to food" : "split evenly"]].forEach(function (r) {
        text(r[0], L, ty, "500 34px " + SANS, INK); if (r[2]) text(r[2], L + 130, ty, "400 24px " + SANS, MUTED); text(money(r[1]), R, ty, "500 36px " + MONO, INK, "right"); ty += 66;
      });
      g.fillStyle = LINE; g.fillRect(L, ty - 40, IW - 56, 2); ty += 6;
      g.fillStyle = col(who); g.beginPath(); g.arc(L + 16, ty - 12, 16, 0, 6.2832); g.fill();
      text("Total", L + 48, ty, "800 38px " + SANS, INK); text(money(c.totals[who]), R, ty, "800 44px " + MONO, ACC, "right");
    }
    text("Split with Split the Check", W / 2, H - 50, "500 24px " + SANS, MUTED, "center");
    return cv;
  }
  function copyImage(btn) {
    var note = $("#imgnote"), ok = function () { var o = btn.textContent; btn.textContent = "Copied!"; setTimeout(function () { btn.textContent = o; }, 1600); },
      fail = function () { note.style.color = "var(--warn)"; note.textContent = "Copying is blocked here. Press and hold the picture, then tap Copy or Save."; };
    if (!lastCanvas) return;
    try { lastCanvas.toBlob(function (b) { try { navigator.clipboard.write([new ClipboardItem({ "image/png": b })]).then(ok, fail); } catch (e) { fail(); } }, "image/png"); } catch (e) { fail(); }
  }

  /* ---- paint everything that depends on the numbers ---- */
  function paintAll() {
    var c = compute();
    $("#billtotal").textContent = money(c.grand);
    $("#meta").textContent = billHead(true);
    $("#pfill").style.width = (items.length ? c.doneCount / items.length * 100 : 0) + "%";
    $("#pcount").textContent = items.length ? c.doneCount + " of " + items.length + " dishes assigned" : "No items yet";
    $("#pleft").textContent = !items.length ? "" : c.unassigned >= 0.5 ? money(c.unassigned) + " left to assign" : "All assigned";
    if ($("#tipbig")) paintTip();
    c.totals.forEach(function (v, i) {
      tween($('[data-own="' + i + '"]'), "own" + i, v);
      var b = $('[data-brk="' + i + '"]'); if (b) b.innerHTML = "<span>Food " + money(c.food[i]) + "</span><span>Tax " + money(c.taxO[i]) + "</span><span>Tip " + money(c.tipO[i]) + "</span>";
    });
    $("#cFood").textContent = money(c.sub); $("#cTax").textContent = money(c.tax); $("#cTip").textContent = money(c.tip);
    var ok = Math.abs(c.sum - c.grand) < 1;
    $("#cRow").className = "check " + (ok ? "good" : "bad");
    $("#cLbl").textContent = ok ? "Everyone adds up to the bill" : "Still unassigned";
    $("#cVal").textContent = money(ok ? c.grand : c.grand - c.sum);
    $("#pills").innerHTML = c.totals.map(function (v, i) { return '<div class="pill">' + av(i) + '<span><span class="nm">' + esc(nm(i)) + "</span><b>" + money(v) + "</b></span></div>"; }).join("");
    var pv = $("#preview"); if (pv) pv.textContent = summaryText(c);
    save(); scheduleShare();
    var l = $("#dleft"); l.textContent = !items.length ? "Add items to start" : c.unassigned >= 0.5 ? money(c.unassigned) + " unassigned" : "All assigned ✓"; l.className = "left" + (!items.length || c.unassigned >= 0.5 ? "" : " ok");
  }

  /* ---- events ---- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.id === "reset" || t.id === "delBill") {
      var isDel = t.id === "delBill", label = isDel ? "Delete bill" : "Reset";
      if (!t.classList.contains("arm")) { t.classList.add("arm"); t.textContent = isDel ? "Tap again to delete" : "Tap again to clear"; clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.remove("arm"); t.textContent = label; }, 3200); return; }
      clearTimeout(t._tm); t.classList.remove("arm"); t.textContent = label;
      if (isDel) { bills.splice(cur, 1); cur = Math.max(0, Math.min(cur, bills.length - 1)); }
      else { var ob = bills[cur]; bills[cur] = newBill(ob.kind, ob.title, ob.id); }
      bind(); renderAll(); window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); return;
    }
    if (t.dataset.bill != null) return goBill(+t.dataset.bill);
    if (t.id === "newBill") {
      var nb = newBill("manual", "Bill " + (bills.length + 1), nextBillId++); nb.S.n = S.n; nb.S.names = S.names.slice();
      bills.push(nb); return goBill(bills.length - 1);
    }
    if (t.id === "addBtn") return addItem();
    if (t.dataset.sw != null) { S.shareWho = t.dataset.sw === "all" ? "all" : +t.dataset.sw; save(); paintShare(); return; }
    if (t.id === "copyimg") return copyImage(t);
    if (t.id === "plus") return setCount(S.n + 1);
    if (t.id === "minus") return setCount(S.n - 1);
    var card = t.closest(".dish");
    if (card) {
      var it = byId(+card.dataset.id); if (!it) return;
      if (t.dataset.del) { items.splice(items.indexOf(it), 1); renderDishList(); paintAll(); return; }
      if (t.dataset.p != null) { var p = +t.dataset.p, ids = sharesOf(it); ids = it.shares[p] != null ? ids.filter(function (x) { return x !== p; }) : ids.concat(p); it.shares = evenShares(ids.sort(function (a, b) { return a - b; })); }
      else if (t.dataset.all) { var every = []; for (var k = 0; k < S.n; k++) every.push(k); it.shares = sharesOf(it).length === S.n ? {} : evenShares(every); }
      else if (t.dataset.open) it.open = !it.open;
      else if (t.dataset.even) it.shares = evenShares(sharesOf(it).sort(function (a, b) { return a - b; }));
      else return;
      paintDish(it); paintAll(); return;
    }
    if (t.dataset.pct != null) { S.tipMode = "pct"; S.tipPct = +t.dataset.pct; $("#tipamt").value = ""; $$("#presets button").forEach(function (b) { b.setAttribute("aria-pressed", b === t); }); return paintAll(); }
    if (t.id === "swTax") { S.taxFollows = !S.taxFollows; t.setAttribute("aria-checked", S.taxFollows); return paintAll(); }
    if (t.id === "swTip") { S.tipFollows = !S.tipFollows; t.setAttribute("aria-checked", S.tipFollows); return paintAll(); }
    if (t.id === "copy") return copyText(summaryText(compute()), t);
    if (t.dataset.copyp != null) return copyText(personText(compute(), +t.dataset.copyp), t);
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset.i != null) { // rename: update labels in place so typing keeps focus
      var i = +t.dataset.i; S.names[i] = t.value;
      var ch = nm(i).charAt(0).toUpperCase();
      $$('[data-avp="' + i + '"]').forEach(function (a) { a.textContent = ch; });
      $$("#sDishes .chip[data-p='" + i + "'] .t").forEach(function (a) { a.textContent = nm(i); });
      $$('[data-who="' + i + '"]').forEach(function (a) { a.textContent = nm(i); });
      $$('[data-copyp="' + i + '"]').forEach(function (a) { a.textContent = "Copy " + nm(i) + "'s breakdown"; });
      items.forEach(paintDish); paintAll(); return;
    }
    if (t.dataset.sl != null) { var it = byId(+t.closest(".dish").dataset.id); if (!it) return; setShare(it, +t.dataset.sl, +t.value); syncSliders(it); paintAll(); return; }
    if (t.id === "billTitle") { bills[cur].title = t.value.slice(0, 28); var tb = $('.tab[data-bill="' + cur + '"]'); if (tb) tb.textContent = t.value.trim() || "Bill"; paintAll(); return; }
    if (t.id === "tipamt") { S.tipMode = "amt"; S.tipAmtCents = parseMoney(t.value); $$("#presets button").forEach(function (b) { b.setAttribute("aria-pressed", "false"); }); paintAll(); }
    if (t.id === "taxamt") { S.taxCents = parseMoney(t.value); paintAll(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return; var id = e.target.id;
    if (id === "addName") { e.preventDefault(); $("#addPrice").focus(); }
    else if (id === "addPrice" || id === "addQty") { e.preventDefault(); addItem(); }
  });

  load();
  renderAll();
})();
</script>
