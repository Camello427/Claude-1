<title>Split the Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one scrolling page in five numbered steps (who's here, who ate what, who paid, tip, who pays who), pinned live balances at the bottom. Cool white ground, indigo accent, vivid person colors. */
:root {
  --bg: #f4f6fc;
  --surface: #ffffff;
  --surface-2: #eaeefa;
  --ink: #131a33;
  --muted: #535e7d;
  --line: #dce2f3;
  --accent: #3d5afe;
  --accent-ink: #ffffff;
  --accent-soft: #e0e6ff;
  --warn: #c2410c;
  --warn-soft: #ffe9dd;
  --ok: #0b8a5f;
  --ok-soft: #dcf5ea;
  --pl: 47%;
  --ps: 68%;
  --pt: #ffffff;
  --shadow: 0 1px 2px rgba(19,26,51,.05), 0 8px 22px rgba(61,90,254,.08);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1226; --surface: #161d38; --surface-2: #202849; --ink: #eef1ff; --muted: #a3add6; --line: #2b3562;
    --accent: #8c9eff; --accent-ink: #0d1226; --accent-soft: #28326b; --warn: #ffa45c; --warn-soft: #3d2a18; --ok: #4fd8a1; --ok-soft: #133a2d;
    --pl: 66%; --ps: 78%; --pt: #0d1226; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1226; --surface: #161d38; --surface-2: #202849; --ink: #eef1ff; --muted: #a3add6; --line: #2b3562;
  --accent: #8c9eff; --accent-ink: #0d1226; --accent-soft: #28326b; --warn: #ffa45c; --warn-soft: #3d2a18; --ok: #4fd8a1; --ok-soft: #133a2d;
  --pl: 66%; --ps: 78%; --pt: #0d1226; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { overflow-x: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45; padding-inline: 16px; -webkit-tap-highlight-color: transparent; }
body, button, input, label { touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font-size: max(16px, 1em); }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
#app { max-width: 600px; margin: 0 auto; padding-block: 18px 170px; }
section.blk { margin-top: 34px; scroll-margin-top: 14px; }
.sh { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; }
.sh .num { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 18px var(--f-display); flex: none; }
h2 { font: 800 25px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.say { color: var(--muted); margin: 0 0 14px 46px; font-size: 15px; }
.hint { color: var(--muted); font-size: 14px; }
.sec { font: 700 12px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.top h1 { font: 800 32px/1 var(--f-display); letter-spacing: -.03em; margin: 0; }
.top p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.rightcol { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
.pillbtn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font: 700 13px var(--f-body); color: var(--muted); }
.billpill { text-align: right; }
.billpill small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.billpill b { font: 500 22px var(--f-mono); font-variant-numeric: tabular-nums; }

/* bills */
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font: 700 14px var(--f-body); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: transform .15s, background .2s; }
.tab:active { transform: scale(.95); }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab.new { border-style: dashed; color: var(--accent); background: transparent; }
.billname { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.billname label { color: var(--muted); font-size: 14px; flex: none; }
.textin { flex: 1; min-width: 0; width: 100%; font: 500 16px var(--f-body); background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; outline: none; }
.textin:focus, .qtybox input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* steps strip */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 16px; }
.stp { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 4px 7px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; transition: border-color .25s, background .25s; }
.stp .sn { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; font: 800 13px var(--f-display); transition: background .25s, color .25s; }
.stp span { font-size: 12px; font-weight: 700; line-height: 1.15; }
.stp small { font: 500 11px var(--f-mono); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stp.done { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.stp.done .sn { background: var(--ok); color: #fff; }
.stp.todo .sn { background: var(--warn); color: #fff; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* avatars + chips */
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; background: hsl(var(--h) var(--ps) var(--pl)); color: var(--pt); font: 700 14px var(--f-body); }
.av.lg { width: 42px; height: 42px; font-size: 18px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h) var(--ps) var(--pl)); display: inline-block; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 15px; font-weight: 500; transition: transform .15s, background .2s, border-color .2s; max-width: 100%; }
.chip .av { width: 28px; height: 28px; font-size: 13px; }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 11ch; }
.chip .mono { font: 500 12px var(--f-mono); color: var(--muted); }
.chip:active { transform: scale(.92); }
.chip[aria-pressed="true"] { background: hsl(var(--h) var(--ps) var(--pl) / .16); border-color: hsl(var(--h) var(--ps) var(--pl)); animation: bump .3s cubic-bezier(.3,1.6,.5,1); }
.chip.all { padding: 5px 14px; color: var(--muted); }
.chip.all[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip.nobody[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--ink); }
@keyframes bump { 0% { transform: scale(.85); } 100% { transform: scale(1); } }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(6px); } to { opacity: 1; transform: none; } }

/* people */
.pp { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; gap: 12px; }
.round { width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-ink); font: 700 26px/1 var(--f-body); display: grid; place-items: center; transition: transform .15s, opacity .2s; }
.round:active { transform: scale(.88); }
.round:disabled { opacity: .3; cursor: default; }
.num-big { font: 800 48px/1 var(--f-display); min-width: 1.3ch; text-align: center; font-variant-numeric: tabular-nums; }
.bump { animation: bump .3s cubic-bezier(.3,1.6,.5,1); }
.ppl { color: var(--muted); font-size: 15px; flex: 1; min-width: 120px; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
.namebox { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 14px; padding: 5px 8px 5px 5px; animation: pop .35s cubic-bezier(.3,1.5,.5,1) both; min-width: 0; }
.namebox input { flex: 1; min-width: 0; font: 500 16px var(--f-body); background: transparent; color: var(--ink); border: none; outline: none; padding: 6px 2px; }
.namebox:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.linkbtn { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 14px; padding: 6px 2px; }

/* dishes */
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbtn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; font: 700 14px var(--f-body); color: var(--ink); cursor: pointer; transition: transform .15s; }
.toolbtn:active { transform: scale(.95); }
.toolbtn.primaryish { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.toolbtn svg { width: 18px; height: 18px; }
.scanmsg { margin: -4px 0 12px; font-size: 14px; color: var(--muted); }
.progress { margin-bottom: 12px; }
.progress .row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 6px; gap: 8px; }
.progress .row b { color: var(--ink); }
.track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.dish { padding: 14px; transition: border-color .25s, box-shadow .3s; }
.dish.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.dish.flash { box-shadow: 0 0 0 4px var(--warn); }
.dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.dmeta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 2px 0 12px; min-height: 32px; }
.dsub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--muted); min-width: 0; }
.dicons { display: flex; gap: 6px; flex: none; }
.dname { font: 700 18px var(--f-display); min-width: 0; overflow-wrap: anywhere; }
.qty { font: 500 13px var(--f-mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; }
.ptag { font: 700 12px var(--f-body); color: var(--ok); background: var(--ok-soft); border-radius: 6px; padding: 3px 8px; }
.dprice { font: 500 19px var(--f-mono); font-variant-numeric: tabular-nums; flex: none; }
.icon { flex: none; width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.icon svg { width: 16px; height: 16px; }
.icon:active { transform: scale(.88); }
.split { margin-top: 10px; }
.bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--line); gap: 2px; }
.bar i { display: block; height: 100%; background: hsl(var(--h) var(--ps) var(--pl)); transition: width .35s cubic-bezier(.2,.8,.2,1); min-width: 0; }
.tbl { display: grid; grid-template-columns: 1fr auto auto; column-gap: 18px; row-gap: 8px; margin-top: 12px; align-items: center; }
.tbl .who { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 16px; }
.tbl .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl .pc { font: 400 14px var(--f-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.tbl .am { font: 500 16px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.sline { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--muted); }
.sline.warn { color: var(--warn); font-weight: 700; margin-top: 0; }
.sliders { display: grid; gap: 12px; margin-top: 6px; padding-top: 12px; border-top: 1px dashed var(--line); animation: pop .3s both; }
.srow .lab { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; font-size: 15px; font-weight: 500; }
.srow .lab .pc { margin-left: auto; font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.srow .lab .am { font: 400 13px var(--f-mono); color: var(--muted); min-width: 6ch; text-align: right; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; --c: var(--accent); }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: linear-gradient(to right, var(--c) var(--p,0%), var(--line) var(--p,0%)); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--c); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c); margin-top: -10px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c); }
.editgrid { display: grid; gap: 10px; }
.addrow2 { display: flex; gap: 10px; align-items: center; }
.money { display: flex; align-items: center; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 12px; width: 140px; }
.addrow2 .money { width: auto; flex: 1; }
.money:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.money span { color: var(--muted); font-family: var(--f-mono); }
.money input { border: none; background: transparent; color: var(--ink); font: 500 18px var(--f-mono); padding: 10px 6px; width: 100%; min-width: 0; outline: none; text-align: right; }
.qtybox { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.qtybox input { width: 64px; text-align: center; font: 500 18px var(--f-mono); background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 4px; outline: none; }
.btnrow { display: flex; gap: 10px; }
.btnrow > * { flex: 1; }
.empty { text-align: center; color: var(--muted); padding: 22px 16px; }

/* who paid */
.q { font: 700 17px var(--f-body); margin: 0 0 10px; }
.paylist { display: flex; flex-direction: column; gap: 8px; }
.payrow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); transition: background .2s, border-color .2s, transform .12s; }
.payrow:active { transform: scale(.98); }
.payrow .box { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; font: 700 14px/1 var(--f-body); transition: background .2s, border-color .2s, color .2s; }
.payrow .pn { min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.payrow .pn small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.payrow .pa { font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.payrow[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); }
.payrow[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.explain { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }

/* tip */
.big { font: 500 38px/1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tiprow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.presets button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 12px 0; font: 700 16px var(--f-body); transition: transform .15s, background .2s, border-color .2s; }
.presets button:active { transform: scale(.94); }
.presets button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.field { display: flex; align-items: center; gap: 10px; }
.field label { color: var(--muted); font-size: 15px; flex: 1; }
.switch { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: none; padding: 2px 0; }
.switch .txt { flex: 1; min-width: 0; }
.switch .txt b { display: block; font-weight: 700; font-size: 16px; }
.switch .txt small { color: var(--muted); font-size: 13px; }
.tg { width: 52px; height: 32px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .25s; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
.switch[aria-checked="true"] .tg { background: var(--accent); }
.switch[aria-checked="true"] .tg::after { transform: translateX(20px); }
hr { border: none; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }

/* who pays who */
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700; }
.xfer { display: grid; grid-template-columns: auto auto auto 1fr; align-items: center; gap: 10px; padding: 14px; animation: pop .4s cubic-bezier(.3,1.4,.5,1) both; }
.xfer .arrow { color: var(--muted); font: 700 22px var(--f-body); }
.xfer .words { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.xfer .words span { font-size: 17px; }
.xfer .words b { font: 500 30px var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.xfer .venmo { grid-column: 1 / -1; font-size: 14px; }
.xfer .venmo a { color: var(--accent); font-weight: 700; }
.allsquare { text-align: center; padding: 18px; font: 700 18px var(--f-display); color: var(--ok); }
.person { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.person:active { transform: scale(.98); }
.person .nm { display: block; font: 700 17px var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .sub { display: block; font: 400 12px var(--f-mono); color: var(--muted); }
.person .bal { text-align: right; }
.person .bal small { display: block; font: 700 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.person .bal b { font: 500 20px var(--f-mono); font-variant-numeric: tabular-nums; }
.person .bal.back small, .person .bal.back b { color: var(--ok); }
.check { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); padding: 3px 2px; flex-wrap: wrap; }
.check b { font: 500 15px var(--f-mono); color: var(--ink); }
.primary { width: 100%; border: none; border-radius: 16px; padding: 15px; background: var(--accent); color: var(--accent-ink); font: 700 16px var(--f-body); transition: transform .15s; }
.primary:active { transform: scale(.97); }
.ghost { width: 100%; border: 1.5px solid var(--line); border-radius: 16px; padding: 13px; background: var(--surface); font: 700 15px var(--f-body); }
.ghost:active { transform: scale(.98); }
.copybox { margin: 0; white-space: pre-wrap; font: 400 13px var(--f-mono); background: var(--surface-2); border-radius: 12px; padding: 12px; max-height: 320px; overflow: auto; }
#shareimg { width: 100%; border-radius: 14px; border: 1px solid var(--line); display: block; }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(19,26,51,.1); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
.dockin { max-width: 600px; margin: 0 auto; padding-inline: 16px; }
.dstat { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.dstat > span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dleft { border: none; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 4px 12px; font: 700 13px var(--f-body); }

  async function scanReceipt(file) {
    var msg = $("#scanMsg"); msg.hidden = false; msg.style.color = ""; msg.textContent = "Reading your receipt… this can take up to a minute.";

    var prompt = "This image is a photo of a restaurant or store receipt. Read every purchased line item.\n" +
      'Reply with only JSON in exactly this shape: {"title": "store name or empty string", "items": [{"name": "Burger", "qty": 1, "price": 29.00}], "tax": 4.50, "tip": 0, "subtotal": 120.00}\n' +
      "Rules: price is the line total in dollars for that line (not the per-unit price). List add-ons that have their own price (like 'Add Chicken') as separate items. " +
      "Do not list subtotal, tax, tip, service charge, total, payments, or change as items. Use 0 for tax or tip when not printed. Use null for subtotal when not printed. Keep item names short and readable.";

      var r = await sampleFn.json(prompt, { images: [file], signal: scanCtl.signal });
      var got = (r && Array.isArray(r.items) ? r.items : []).map(function (x) {
        x = x || {};
        return { name: String(x.name || "").trim().slice(0, 40), qty: Math.max(1, Math.min(99, Math.round(+x.qty) || 1)), price: Math.round((+x.price || 0) * 100) };

      snap("Receipt added.");

    } catch (e) {

    $("#pills").innerHTML = c.bal.map(function (b, i) {
      var back = b < 0;
      return '<button class="pill' + (back ? " back" : "") + '" data-sheet="' + i + '">' + av(i) + '<span><span class="nm">' + esc(nm(i)) + (Math.abs(b) < 1 ? " · square" : back ? " gets" : " pays") + "</span><b>" + money(Math.abs(b)) + "</b></span></button>";
    }).join("");
    var l = $("#dleft");
    l.textContent = !items.length ? "Add items to start" : c.all ? "All done ✓" : (items.length - c.doneCount) + " left · show me";
    l.className = "dleft" + (c.all ? " ok" : "");
    if (wasAll === false && c.all) confetti();
    wasAll = c.all;
    save(); scheduleShare();
  }
  function renderAll() { renderBills(); renderPeople(); renderDishes(); renderTip(); renderSettle(); wasAll = null; paintAll(); }

  /* ================= events ================= */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) { if (e.target.id === "sheet") closeSheet(); return; }
    if (t.id === "undoBtn") return undo();
    if (t.id === "closeSheet") return closeSheet();
    if (t.dataset.copyp != null) return copyText(personText(compute(), +t.dataset.copyp), t);
    if (t.dataset.sheet != null) return openSheet(+t.dataset.sheet);
    if (t.dataset.goto) { var sec = $("#" + t.dataset.goto); if (sec) sec.scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); return; }
    if (t.id === "dleft" || t.dataset.jump) return jumpUnassigned();
    if (t.id === "reset") { snap("Bill reset."); var ob = bills[cur]; bills[cur] = newBill(ob.kind, ob.title, ob.id); bind(); renderAll(); window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); return; }
    if (t.id === "delBill") { snap("Deleted " + (bills[cur].title || "the bill") + "."); bills.splice(cur, 1); cur = Math.max(0, Math.min(cur, bills.length - 1)); bind(); renderAll(); return; }
    if (t.dataset.bill != null) return goBill(+t.dataset.bill);
    if (t.id === "newBill") { var nb = newBill("manual", "Bill " + (bills.length + 1), nextBillId++); nb.S.n = S.n; nb.S.names = S.names.slice(); nb.S.venmo = S.venmo.slice(); bills.push(nb); return goBill(bills.length - 1); }
    if (t.id === "plus") return setCount(S.n + 1);
    if (t.id === "minus") return setCount(S.n - 1);
    if (t.id === "venmoToggle") { S.showVenmo = !S.showVenmo; renderPeople(); return save(); }
    if (t.id === "addBtn") return addItem();
    if (t.id === "evenAll") { if (!items.length) return; snap("Everything split evenly."); var ev = evenShares(everyone()); items.forEach(function (it) { it.shares = JSON.parse(JSON.stringify(ev)); }); renderDishList(); return paintAll(); }
    if (t.id === "clearAll") { if (!items.length) return; snap("Cleared every name."); items.forEach(function (it) { it.shares = {}; it.open = false; }); renderDishList(); return paintAll(); }
    if (t.dataset.payer != null) { S.checkPayer = +t.dataset.payer; return paintAll(); }
    if (t.dataset.paywho != null) { S.payWho = +t.dataset.paywho; return paintAll(); }
    if (t.dataset.payitem != null) { var pit = byId(+t.dataset.payitem); if (!pit) return; pit.paidBy = pit.paidBy === S.payWho ? null : S.payWho; paintDish(pit); return paintAll(); }
    var card = t.closest(".dish");
    if (card) {
      var it = byId(+card.dataset.id); if (!it) return;
      if (t.dataset.del) { snap("Removed " + it.name + "."); items.splice(items.indexOf(it), 1); renderDishList(); return paintAll(); }
      if (t.dataset.edit) { it._edit = true; card.outerHTML = dishHTML(it); var nmIn = $("#ed-name-" + it.id); if (nmIn) nmIn.focus(); return; }
      if (t.dataset.edcancel) { it._edit = false; card.outerHTML = dishHTML(it); return paintDish(it); }
      if (t.dataset.edsave) {
        var np = parseMoney($("#ed-price-" + it.id).value); if (np <= 0) { $("#ed-price-" + it.id).focus(); return; }
        snap("Changed " + it.name + ".");
        it.name = ($("#ed-name-" + it.id).value.trim() || it.name).slice(0, 40); it.price = np; it.qty = Math.max(1, Math.min(99, parseInt($("#ed-qty-" + it.id).value, 10) || 1)); it._edit = false;
        card.outerHTML = dishHTML(it); paintDish(it); return paintAll();
      }
      if (t.dataset.p != null) { var p = +t.dataset.p, ids = sharesOf(it); ids = it.shares[p] != null ? ids.filter(function (x) { return x !== p; }) : ids.concat(p); it.shares = evenShares(ids.sort(function (a, b) { return a - b; })); }
      else if (t.dataset.all) it.shares = sharesOf(it).length === S.n ? {} : evenShares(everyone());
      else if (t.dataset.open) it.open = !it.open;
      else if (t.dataset.even) it.shares = evenShares(sharesOf(it));
      else return;
      paintDish(it); return paintAll();
    }
    if (t.dataset.pct != null) { S.tipMode = "pct"; S.tipPct = +t.dataset.pct; $("#tipamt").value = ""; $$("#presets button").forEach(function (b) { b.setAttribute("aria-pressed", b === t); }); return paintAll(); }
    if (t.id === "swTax") { S.taxFollows = !S.taxFollows; t.setAttribute("aria-checked", S.taxFollows); return paintAll(); }
    if (t.id === "swTip") { S.tipFollows = !S.tipFollows; t.setAttribute("aria-checked", S.tipFollows); return paintAll(); }
    if (t.id === "swTipTax") { S.tipOnTax = !S.tipOnTax; t.setAttribute("aria-checked", S.tipOnTax); return paintAll(); }
    if (t.id === "swRound") { S.roundUp = !S.roundUp; t.setAttribute("aria-checked", S.roundUp); return paintAll(); }
    if (t.id === "copy") return copyText(summaryText(compute()), t);
    if (t.id === "copyCombo") return copyText(comboText(combined()), t);
    if (t.dataset.sw != null) { S.shareWho = t.dataset.sw === "all" ? "all" : +t.dataset.sw; save(); return paintShare(); }
    if (t.id === "copyimg") return copyImage(t);
    if (t.id === "saveimg") return saveImage(t);
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset.i != null) { // rename in place so typing keeps focus
      var i = +t.dataset.i; S.names[i] = t.value;
      $$('[data-avp="' + i + '"]').forEach(function (a) { a.textContent = nm(i).charAt(0).toUpperCase(); });
      $$("#s2 .chip[data-p='" + i + "'] .t").forEach(function (a) { a.textContent = nm(i); });
      items.forEach(paintDish); return paintAll();
    }
    if (t.dataset.v != null) { S.venmo[+t.dataset.v] = t.value.replace(/^@/, "").replace(/[^A-Za-z0-9_-]/g, ""); return paintAll(); }
    if (t.dataset.sl != null) { var it = byId(+t.closest(".dish").dataset.id); if (!it) return; setShare(it, +t.dataset.sl, +t.value); syncSliders(it); return paintAll(); }
    if (t.id === "billTitle") { bills[cur].title = t.value.slice(0, 28); return paintAll(); }
    if (t.id === "tipamt") { S.tipMode = "amt"; S.tipAmtCents = parseMoney(t.value); $$("#presets button").forEach(function (b) { b.setAttribute("aria-pressed", "false"); }); return paintAll(); }
    if (t.id === "taxamt") { S.taxCents = parseMoney(t.value); return paintAll(); }
  });
  document.addEventListener("change", function (e) { if (e.target.id === "scanFile" && e.target.files && e.target.files[0] && sampleFn) scanReceipt(e.target.files[0]); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("#sheet").hidden) return closeSheet();
    if (e.key !== "Enter") return; var id = e.target.id;
    if (id === "addName") { e.preventDefault(); $("#addPrice").focus(); }
    else if (id === "addPrice" || id === "addQty") { e.preventDefault(); addItem(); }
  });

  /* ================= start ================= */
  load();
  renderAll();
  // Optional abilities from the Claude viewer: reading receipt photos and saving pictures.
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then(function (s) {
      if (!s) return; sampleFn = s;
      return s.limits().then(function (lim) { if (lim && lim.images) { canImages = true; var b = $("#scanBtn"); if (b) b.hidden = false; renderDishList(); } }, function () {});
    }, function () {});
    window.claude.use("downloads").then(function (d) { if (!d) return; dlFn = d; var b = $("#saveimg"); if (b) b.hidden = false; }, function () {});
  }
})();
</script>
