<title>Split the Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one scrolling page (people, dishes, tip & tax, totals) with a pinned live-totals bar. Crisp white, ink navy, electric blue accent, saturated person colors. */
:root {
  --bg: #f5f6fb;
  --surface: #ffffff;
  --surface-2: #eef0f8;
  --ink: #0e1128;
  --muted: #5d6385;
  --line: #e0e3f0;
  --accent: #2c55ff;
  --accent-ink: #ffffff;
  --accent-soft: #e4eaff;
  --warn: #c2410c;
  --warn-soft: #ffedd9;
  --ok: #0f9d58;
  --pl: 50%;
  --ps: 85%;
  --pt: #ffffff;
  --shadow: 0 1px 2px rgba(14,17,40,.05), 0 10px 28px rgba(44,85,255,.07);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d1c; --surface: #151834; --surface-2: #1d2142; --ink: #f1f3ff; --muted: #9aa1cc; --line: #2a2f58;
    --accent: #7b93ff; --accent-ink: #0b0d1c; --accent-soft: #232a5e; --warn: #ffb36b; --warn-soft: #3a2812; --ok: #4ade80;
    --pl: 64%; --ps: 90%; --pt: #0b0d1c; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d1c; --surface: #151834; --surface-2: #1d2142; --ink: #f1f3ff; --muted: #9aa1cc; --line: #2a2f58;
  --accent: #7b93ff; --accent-ink: #0b0d1c; --accent-soft: #232a5e; --warn: #ffb36b; --warn-soft: #3a2812; --ok: #4ade80;
  --pl: 64%; --ps: 90%; --pt: #0b0d1c; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.4; padding-inline: 16px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
#app { max-width: 600px; margin: 0 auto; padding-block: 18px 150px; }
section.blk { margin-top: 30px; scroll-margin-top: 12px; }
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
h2 { font: 800 24px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; }
.hint { color: var(--muted); font-size: 13px; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top h1 { font: 800 32px/1 var(--f-display); letter-spacing: -.03em; margin: 0; }
.top p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
.billpill { text-align: right; flex: none; }
.billpill small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.billpill b { font: 500 22px var(--f-mono); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* avatars */
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; background: hsl(var(--h) var(--ps) var(--pl)); color: var(--pt); font: 700 14px var(--f-body); }
.av.lg { width: 40px; height: 40px; font-size: 17px; }

/* people */
.pp { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; gap: 12px; }
.round { width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-ink); font: 700 26px/1 var(--f-body); display: grid; place-items: center; transition: transform .15s, opacity .2s; }
.round:active { transform: scale(.88); }
.round:disabled { opacity: .3; cursor: default; }
.num { font: 800 46px/1 var(--f-display); min-width: 1.3ch; text-align: center; font-variant-numeric: tabular-nums; }
.bump { animation: bump .3s cubic-bezier(.3,1.6,.5,1); }
@keyframes bump { 0% { transform: scale(.8); } 100% { transform: scale(1); } }
.ppl { color: var(--muted); font-size: 14px; flex: 1; min-width: 120px; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
.namebox { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 14px; padding: 5px 8px 5px 5px; animation: pop .35s cubic-bezier(.3,1.5,.5,1) both; min-width: 0; }
.namebox input { flex: 1; min-width: 0; font: 500 15px var(--f-body); background: transparent; color: var(--ink); border: none; outline: none; padding: 6px 2px; }
.namebox:focus-within { box-shadow: 0 0 0 2px var(--accent); }
@keyframes pop { from { opacity: 0; transform: scale(.9) translateY(6px); } to { opacity: 1; transform: none; } }

/* dishes */
.progress { margin-bottom: 12px; }
.progress .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; gap: 8px; }
.progress .row b { color: var(--ink); }
.track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.dish { padding: 14px; transition: border-color .25s; }
.dish.done { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.dname { font: 700 17px var(--f-display); min-width: 0; overflow-wrap: anywhere; }
.qty { font: 500 12px var(--f-mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 2px; }
.dprice { font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: flex; align-items: center; gap: 6px; padding: 4px 11px 4px 4px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 14px; font-weight: 500; transition: transform .15s, background .2s, border-color .2s; max-width: 100%; }
.chip .av { width: 26px; height: 26px; font-size: 12px; }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 11ch; }
.chip:active { transform: scale(.92); }
.chip[aria-pressed="true"] { background: hsl(var(--h) var(--ps) var(--pl) / .16); border-color: hsl(var(--h) var(--ps) var(--pl)); animation: bump .3s cubic-bezier(.3,1.6,.5,1); }
.chip.all { padding: 4px 14px; color: var(--muted); }
.chip.all[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.split { margin-top: 10px; }
.bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--line); gap: 2px; }
.bar i { display: block; height: 100%; background: hsl(var(--h) var(--ps) var(--pl)); transition: width .35s cubic-bezier(.2,.8,.2,1); min-width: 0; }
.sline { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.sline.warn { color: var(--warn); font-weight: 500; margin-top: 0; }
.linkbtn { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 13px; padding: 6px 2px; }
.sliders { display: grid; gap: 12px; margin-top: 6px; padding-top: 12px; border-top: 1px dashed var(--line); animation: pop .3s both; }
.srow .lab { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; font-size: 14px; font-weight: 500; }
.srow .lab .pc { margin-left: auto; font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.srow .lab .am { font: 400 12px var(--f-mono); color: var(--muted); min-width: 6ch; text-align: right; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; --c: var(--accent); }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: linear-gradient(to right, var(--c) var(--p,0%), var(--line) var(--p,0%)); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--c); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c); margin-top: -10px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c); }

/* tip & tax */
.big { font: 500 36px/1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tiprow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tipnote { color: var(--muted); font-size: 13px; }
.presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.presets button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 11px 0; font: 700 15px var(--f-body); transition: transform .15s, background .2s, border-color .2s; }
.presets button:active { transform: scale(.94); }
.presets button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.field { display: flex; align-items: center; gap: 10px; }
.field label { color: var(--muted); font-size: 14px; flex: 1; }
.money { display: flex; align-items: center; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 12px; width: 140px; }
.money:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.money span { color: var(--muted); font-family: var(--f-mono); }
.money input { border: none; background: transparent; color: var(--ink); font: 500 18px var(--f-mono); padding: 10px 6px; width: 100%; min-width: 0; outline: none; text-align: right; }
.switch { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: none; padding: 2px 0; }
.switch .txt { flex: 1; min-width: 0; }
.switch .txt b { display: block; font-weight: 700; }
.switch .txt small { color: var(--muted); font-size: 13px; }
.tg { width: 52px; height: 32px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .25s; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
.switch[aria-checked="true"] .tg { background: var(--accent); }
.switch[aria-checked="true"] .tg::after { transform: translateX(20px); }
hr { border: none; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }

/* totals */
.tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.pcard { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; padding: 14px; border-top: 5px solid hsl(var(--h) var(--ps) var(--pl)); animation: pop .45s cubic-bezier(.3,1.4,.5,1) both; min-width: 0; }
.pcard .who { font: 700 16px var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .owes { grid-column: 1 / -1; font: 500 34px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 6px; }
.pcard .brk { grid-column: 1 / -1; display: flex; gap: 4px 12px; flex-wrap: wrap; font: 400 12px var(--f-mono); color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.check { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); padding: 3px 2px; flex-wrap: wrap; }
.check b { font: 500 15px var(--f-mono); color: var(--ink); }
.check.bad b { color: var(--warn); }
.check.good b { color: var(--ok); }
.primary { width: 100%; border: none; border-radius: 16px; padding: 15px; background: var(--accent); color: var(--accent-ink); font: 700 16px var(--f-body); transition: transform .15s; }
.primary:active { transform: scale(.97); }
.mini { grid-column: 1 / -1; margin-top: 10px; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 9px; font: 700 13px var(--f-body); }
.mini:active { transform: scale(.97); }
.ghost { width: 100%; border: 1.5px solid var(--line); border-radius: 16px; padding: 13px; background: var(--surface); font: 700 15px var(--f-body); }
.ghost:active { transform: scale(.98); }
.copybox { margin: 0; white-space: pre-wrap; font: 400 13px var(--f-mono); background: var(--surface-2); border-radius: 12px; padding: 12px; margin-top: 10px; max-height: 360px; overflow: auto; }

/* pinned live totals */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(14,17,40,.1); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
.dockin { max-width: 600px; margin: 0 auto; padding-inline: 16px; }
.dstat { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.dstat .left { color: var(--warn); }
.dstat .left.ok { color: var(--ok); }
.pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: none; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 14px; padding: 6px 12px 6px 6px; }
.pill .nm { display: block; font-size: 11px; color: var(--muted); max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill b { font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

<div id="app">
  <header class="top">
    <div><h1>Split the Check</h1><p>The James · Babylon · Check #140 · 9/25</p></div>
    <div class="billpill"><small>Bill total</small><b id="billtotal">$0.00</b></div>
  </header>

  <section class="blk" id="sPeople"></section>
  <section class="blk" id="sDishes"></section>
  <section class="blk" id="sTip"></section>
  <section class="blk" id="sTotals"></section>
</div>

<div class="dock" aria-label="Live totals"><div class="dockin">
  <div class="dstat"><span>Who owes</span><span class="left" id="dleft"></span></div>
  <div class="pills" id="pills"></div>
</div></div>

<script>
(function () {
  "use strict";
  var HUES = [222, 8, 150, 38, 280, 335, 190, 95, 20, 250, 120, 310];
  // Receipt lines, prices in cents
  var items = [
    ["Creamed Spinach", 1, 1500], ["Tomahawk", 1, 18500], ["Tanqueray", 1, 1700], ["Caviar Bump", 4, 11200],
    ["Tableside Martini", 2, 6600], ["Caesar", 1, 1900], ["Add Chicken", 1, 1200], ["Burger", 1, 2900],
    ["Weekly Pasta (special)", 1, 3600], ["Michelob Ultra Light", 1, 900], ["Save the Robots IPA", 1, 1000], ["Sticky Toffee Cake", 1, 1500]
  ].map(function (r, i) { return { id: i, name: r[0], qty: r[1], price: r[2], shares: {}, open: false }; });

  var S = { n: 4, names: ["Me", "Friend 1", "Friend 2", "Friend 3"], taxCents: 4594, taxFollows: true, tipFollows: true,
    tipMode: "amt", tipPct: 20, tipAmtCents: 12000 };
  var shown = {};
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function money(c) { var s = Math.abs(c) < 0.5 ? 0 : c; return "$" + (s / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function nm(i) { return (S.names[i] || "").trim() || "Guest " + (i + 1); }
  function hue(i) { return HUES[i % HUES.length]; }
  function av(i, cls) { return '<span class="av ' + (cls || "") + '" data-avp="' + i + '" style="--h:' + hue(i) + '">' + esc(nm(i).charAt(0).toUpperCase()) + "</span>"; }
  function subtotal() { return items.reduce(function (a, it) { return a + it.price; }, 0); }
  function tipCents() { return S.tipMode === "amt" ? S.tipAmtCents : Math.round(subtotal() * S.tipPct / 100); }
  function sharesOf(it) { return Object.keys(it.shares).map(Number); }
  function parseMoney(v) { var n = parseFloat(String(v).replace(/[^0-9.]/g, "")); return isNaN(n) ? 0 : Math.round(n * 100); }

  function lr(total, weights) { // largest-remainder split of whole units
    var sum = weights.reduce(function (a, b) { return a + b; }, 0);
    if (!sum) { var e = weights.length; return weights.map(function (_, i) { return Math.floor(total / e) + (i < total % e ? 1 : 0); }); }
    var raw = weights.map(function (w) { return total * w / sum; });
    var out = raw.map(Math.floor), rem = total - out.reduce(function (a, b) { return a + b; }, 0);
    raw.map(function (r, i) { return [r - Math.floor(r), i]; }).sort(function (a, b) { return b[0] - a[0]; }).slice(0, rem).forEach(function (p) { out[p[1]]++; });
    return out;
  }
  function evenShares(ids) { var v = lr(100, ids.map(function () { return 1; })), o = {}; ids.forEach(function (id, i) { o[id] = v[i]; }); return o; }

  function compute() {
    var sub = subtotal(), tip = tipCents(), tax = S.taxCents, n = S.n, food = [], i, assigned = 0;
    for (i = 0; i < n; i++) food.push(0);
    items.forEach(function (it) {
      var tot = 0;
      sharesOf(it).forEach(function (p) { if (p < n) { food[p] += it.price * it.shares[p] / 100; tot += it.shares[p]; } });
      assigned += it.price * tot / 100;
    });
    var unassigned = sub - assigned;
    var taxR = food.map(function (f) { return S.taxFollows ? tax * f / sub : tax / n; });
    var tipR = food.map(function (f) { return S.tipFollows ? tip * f / sub : tip / n; });
    var raw = food.map(function (f, k) { return f + taxR[k] + tipR[k]; });
    var totals = unassigned < 0.5 ? lr(sub + tax + tip, raw) : raw.map(Math.round); // exact to the cent once everything is assigned
    var taxO = taxR.map(Math.round), tipO = tipR.map(Math.round);
    return { sub: sub, tip: tip, tax: tax, grand: sub + tax + tip, totals: totals, taxO: taxO, tipO: tipO,
      food: totals.map(function (t, k) { return t - taxO[k] - tipO[k]; }), unassigned: unassigned,
      sum: totals.reduce(function (a, b) { return a + b; }, 0),
      doneCount: items.filter(function (it) { return sharesOf(it).length; }).length };
  }

  function tween(el, key, to) {
    if (!el) return;
    var from = shown[key] == null ? 0 : shown[key]; shown[key] = to;
    if (reduce || from === to) { el.textContent = money(to); return; }
    var t0 = performance.now(), d = 450; cancelAnimationFrame(el._raf);
    (function f(t) { var k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = money(from + (to - from) * e); if (k < 1) el._raf = requestAnimationFrame(f); else el.textContent = money(to); })(t0);
  }

  /* ---- people ---- */
  function renderPeople() {
    var boxes = "";
    for (var i = 0; i < S.n; i++) boxes += '<label class="namebox">' + av(i) + '<input data-i="' + i + '" value="' + esc(S.names[i]) + '" maxlength="14" placeholder="Name" aria-label="Name for person ' + (i + 1) + '"></label>';
    $("#sPeople").innerHTML = '<div class="sh"><h2>Who\'s splitting?</h2></div><div class="card"><div class="pp"><div class="stepper"><button class="round" id="minus" aria-label="Fewer people"' + (S.n <= 1 ? " disabled" : "") +
      '>−</button><div class="num" id="count">' + S.n + '</div><button class="round" id="plus" aria-label="More people"' + (S.n >= 12 ? " disabled" : "") + '>+</button></div><div class="ppl">people<br>(receipt says 4 guests)</div></div><div class="names">' + boxes + "</div></div>";
  }
  function setCount(n) {
    n = Math.max(1, Math.min(12, n)); if (n === S.n) return;
    while (S.names.length < n) S.names.push(S.names.length === 0 ? "Me" : "Friend " + S.names.length);
    S.n = n;
    items.forEach(function (it) {
      var ids = sharesOf(it).filter(function (p) { return p < n; });
      if (ids.length !== sharesOf(it).length) { var v = lr(100, ids.map(function (p) { return it.shares[p]; })), o = {}; ids.forEach(function (p, k) { o[p] = v[k]; }); it.shares = ids.length ? o : {}; }
    });
    renderPeople(); renderDishes(); renderTotals(); paintAll();
    var c = $("#count"); c && c.classList.add("bump");
  }

  /* ---- dishes ---- */
  function dishHTML(it) {
    var chips = "";
    for (var p = 0; p < S.n; p++) chips += '<button class="chip" data-p="' + p + '" style="--h:' + hue(p) + '" aria-pressed="false">' + av(p) + '<span class="t">' + esc(nm(p)) + "</span></button>";
    if (S.n > 1) chips += '<button class="chip all" data-all="1" aria-pressed="false">Everyone</button>';
    return '<article class="card dish" id="dish' + it.id + '" data-id="' + it.id + '"><div class="dhead"><div class="dname">' + esc(it.name) + (it.qty > 1 ? '<span class="qty">×' + it.qty + "</span>" : "") +
      '</div><div class="dprice">' + money(it.price) + '</div></div><div class="chips">' + chips + '</div><div class="split"></div></article>';
  }
  function splitHTML(it) {
    var ids = sharesOf(it).sort(function (a, b) { return a - b; });
    if (!ids.length) return '<div class="sline warn"><span>Tap who had this</span></div>';
    var bar = '<div class="bar">' + ids.map(function (p) { return '<i data-bp="' + p + '" style="--h:' + hue(p) + ';width:' + it.shares[p] + '%"></i>'; }).join("") + "</div>";
    if (ids.length === 1) return bar + '<div class="sline"><span>All ' + esc(nm(ids[0])) + "</span><span>" + money(it.price) + "</span></div>";
    var even = ids.every(function (p) { return Math.abs(it.shares[p] - 100 / ids.length) < 1; });
    var sl = it.open ? '<div class="sliders">' + ids.map(function (p) {
      return '<div class="srow"><div class="lab">' + av(p) + "<span>" + esc(nm(p)) + '</span><span class="pc" data-pc="' + p + '">' + it.shares[p] + '%</span><span class="am" data-am="' + p + '">' + money(it.price * it.shares[p] / 100) + "</span></div>" +
        '<input type="range" min="0" max="100" step="1" value="' + it.shares[p] + '" data-sl="' + p + '" style="--c:hsl(' + hue(p) + ' var(--ps) var(--pl));--p:' + it.shares[p] + '%" aria-label="' + esc(nm(p)) + ' share of ' + esc(it.name) + '"></div>';
    }).join("") + '<button class="linkbtn" data-even="1" style="justify-self:start">Reset to even split</button></div>' : "";
    return bar + '<div class="sline"><span>' + (even ? "Even split · " + Math.round(100 / ids.length) + "% each" : "Custom split") + '</span><button class="linkbtn" data-open="1">' + (it.open ? "Done" : "Adjust split") + "</button></div>" + sl;
  }
  function paintDish(it) {
    var el = $("#dish" + it.id); if (!el) return;
    $(".split", el).innerHTML = splitHTML(it);
    el.classList.toggle("done", sharesOf(it).length > 0);
    $$(".chip[data-p]", el).forEach(function (c) { c.setAttribute("aria-pressed", it.shares[+c.dataset.p] != null); });
    var all = $(".chip.all", el); if (all) all.setAttribute("aria-pressed", sharesOf(it).length === S.n);
  }
  function renderDishes() {
    $("#sDishes").innerHTML = '<div class="sh"><h2>Who had what?</h2><span class="hint">Tap names. Shared dishes split evenly.</span></div>' +
      '<div class="progress"><div class="row"><b id="pcount"></b><span id="pleft"></span></div><div class="track"><div class="fill" id="pfill"></div></div></div>' +
      '<div class="stack">' + items.map(dishHTML).join("") + "</div>";
    items.forEach(paintDish);
  }
  function setShare(it, p, v) {
    var ids = sharesOf(it).filter(function (x) { return x !== p; }); v = Math.max(0, Math.min(100, Math.round(v)));
    var w = ids.map(function (x) { return it.shares[x]; }), z = w.reduce(function (a, b) { return a + b; }, 0), vals = lr(100 - v, z ? w : w.map(function () { return 1; }));
    it.shares[p] = v; ids.forEach(function (x, k) { it.shares[x] = vals[k]; });
  }
  function syncSliders(it) {
    var el = $("#dish" + it.id); if (!el) return;
    sharesOf(it).forEach(function (p) {
      var s = $('[data-sl="' + p + '"]', el), pc = $('[data-pc="' + p + '"]', el), am = $('[data-am="' + p + '"]', el), b = $('[data-bp="' + p + '"]', el);
      if (s && document.activeElement !== s) s.value = it.shares[p];
      if (s) s.style.setProperty("--p", it.shares[p] + "%");
      if (pc) pc.textContent = it.shares[p] + "%";
      if (am) am.textContent = money(it.price * it.shares[p] / 100);
      if (b) b.style.width = it.shares[p] + "%";
    });
  }

  /* ---- tip & tax ---- */
  function renderTip() {
    var pre = [0, 15, 18, 20, 25].map(function (v) { return '<button data-pct="' + v + '" aria-pressed="' + (S.tipMode === "pct" && S.tipPct === v) + '">' + (v ? v + "%" : "None") + "</button>"; }).join("");
    $("#sTip").innerHTML = '<div class="sh"><h2>Tip and tax</h2><span class="hint">No tip on the receipt</span></div>' +
      '<div class="card stack"><div class="tiprow"><div><div class="hint" style="margin-bottom:4px">Tip</div><div class="big" id="tipbig"></div></div><div class="tipnote" id="tipnote"></div></div>' +
      '<div class="presets" id="presets">' + pre + '</div>' +
      '<div class="field"><label for="tipamt">Or enter an exact tip</label><div class="money"><span>$</span><input id="tipamt" inputmode="decimal" placeholder="0.00" value="' + (S.tipMode === "amt" ? (S.tipAmtCents / 100).toFixed(2) : "") + '"></div></div><hr>' +
      '<div class="field"><label for="taxamt">Tax on receipt <span id="taxrate" style="font-family:var(--f-mono)"></span></label><div class="money"><span>$</span><input id="taxamt" inputmode="decimal" value="' + (S.taxCents / 100).toFixed(2) + '"></div></div><hr>' +
      '<button class="switch" role="switch" id="swTax" aria-checked="' + S.taxFollows + '"><span class="txt"><b>Tax follows what each person ate</b><small id="swTaxS"></small></span><span class="tg"></span></button>' +
      '<button class="switch" role="switch" id="swTip" aria-checked="' + S.tipFollows + '"><span class="txt"><b>Tip follows what each person ate</b><small id="swTipS"></small></span><span class="tg"></span></button></div>';
  }
  function paintTip() {
    var c = compute();
    $("#tipbig").textContent = money(c.tip);
    $("#tipnote").textContent = S.tipMode === "amt" ? "That's " + (c.tip / c.sub * 100).toFixed(1) + "% of the " + money(c.sub) + " pre-tax subtotal" : "% is figured on the " + money(c.sub) + " pre-tax subtotal";
    $("#swTaxS").textContent = S.taxFollows ? "Bigger plates pay more tax. Turn off to split evenly." : "Tax is split evenly between everyone.";
    $("#swTipS").textContent = S.tipFollows ? "Bigger plates pay more tip. Turn off to split evenly." : "Tip is split evenly between everyone.";
    $("#taxrate").textContent = "(" + (S.taxCents / c.sub * 100).toFixed(2).replace(/\.?0+$/, "") + "%)";
  }

  /* ---- totals ---- */
  function renderTotals() {
    var cards = ""; for (var i = 0; i < S.n; i++)
      cards += '<div class="card pcard" style="--h:' + hue(i) + ';animation-delay:' + (i * 60) + 'ms">' + av(i, "lg") + '<div class="who" data-who="' + i + '">' + esc(nm(i)) + '</div><div class="owes" data-own="' + i + '">$0.00</div><div class="brk" data-brk="' + i + '"></div><button class="mini" data-copyp="' + i + '">Copy ' + esc(nm(i)) + '\'s breakdown</button></div>';
    $("#sTotals").innerHTML = '<div class="sh"><h2>What everyone owes</h2></div><div class="tgrid">' + cards + '</div>' +
      '<div class="card" style="margin-top:12px"><div class="check"><span>Food</span><b id="cFood"></b></div><div class="check"><span>Tax</span><b id="cTax"></b></div><div class="check"><span>Tip</span><b id="cTip"></b></div><div class="check" id="cRow"><span id="cLbl"></span><b id="cVal"></b></div></div>' +
      '<div style="margin-top:16px"><button class="primary" id="copy">Copy full breakdown for everyone</button><p class="hint" style="margin:8px 0 6px">Includes each dish, their percentage, and tax and tip. Paste it into your group text.</p><pre class="copybox" id="preview"></pre></div>';
  }
  function pct(v) { return v + "%"; }
  function personLines(c, i) {
    var l = [nm(i).toUpperCase() + " owes " + money(c.totals[i])];
    items.forEach(function (it) {
      var v = it.shares[i]; if (v == null || it.shares[i] === 0) return;
      l.push("  • " + it.name + (it.qty > 1 ? " ×" + it.qty : "") + ": " + pct(v) + " of " + money(it.price) + " = " + money(Math.round(it.price * v / 100)));
    });
    l.push("  Food " + money(c.food[i]));
    l.push("  Tax " + money(c.taxO[i]) + (S.taxFollows ? " (in proportion to food)" : " (split evenly)"));
    l.push("  Tip " + money(c.tipO[i]) + (S.tipFollows ? " (in proportion to food)" : " (split evenly)"));
    return l;
  }
  function header(c) { return ["The James · Check #140 · 9/25", "Bill " + money(c.grand) + " = food " + money(c.sub) + " + tax " + money(c.tax) + " + tip " + money(c.tip), ""]; }
  function summaryText(c) {
    var l = header(c);
    c.totals.forEach(function (v, i) { l = l.concat(personLines(c, i), [""]); });
    l.push("Quick totals:"); c.totals.forEach(function (v, i) { l.push("  " + nm(i) + ": " + money(v)); });
    return l.join("\n");
  }
  function personText(c, i) { return header(c).concat(personLines(c, i)).join("\n"); }
  function copyText(txt, btn, label) {
    var done = function () { var o = btn.textContent; btn.textContent = "Copied!"; setTimeout(function () { btn.textContent = o; }, 1600); };
    try { navigator.clipboard.writeText(txt).then(done, function () { selectPreview(); }); } catch (err) { selectPreview(); }
  }
  function selectPreview() { var el = $("#preview"); if (!el) return; var r = document.createRange(); r.selectNodeContents(el); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }

  /* ---- paint everything that depends on the numbers ---- */
  function paintAll() {
    var c = compute();
    $("#billtotal").textContent = money(c.grand);
    $("#pfill").style.width = (c.doneCount / items.length * 100) + "%";
    $("#pcount").textContent = c.doneCount + " of " + items.length + " dishes assigned";
    $("#pleft").textContent = c.unassigned >= 0.5 ? money(c.unassigned) + " left to assign" : "All assigned";
    if ($("#tipbig")) paintTip();
    c.totals.forEach(function (v, i) {
      tween($('[data-own="' + i + '"]'), "own" + i, v);
      var b = $('[data-brk="' + i + '"]'); if (b) b.innerHTML = "<span>Food " + money(c.food[i]) + "</span><span>Tax " + money(c.taxO[i]) + "</span><span>Tip " + money(c.tipO[i]) + "</span>";
    });
    $("#cFood").textContent = money(c.sub); $("#cTax").textContent = money(c.tax); $("#cTip").textContent = money(c.tip);
    var ok = Math.abs(c.sum - c.grand) < 1;
    $("#cRow").className = "check " + (ok ? "good" : "bad");
    $("#cLbl").textContent = ok ? "Everyone adds up to the bill" : "Still unassigned";
    $("#cVal").textContent = money(ok ? c.grand : c.grand - c.sum);
    $("#pills").innerHTML = c.totals.map(function (v, i) { return '<div class="pill">' + av(i) + '<span><span class="nm">' + esc(nm(i)) + "</span><b>" + money(v) + "</b></span></div>"; }).join("");
    var pv = $("#preview"); if (pv) pv.textContent = summaryText(c);
    var l = $("#dleft"); l.textContent = c.unassigned >= 0.5 ? money(c.unassigned) + " unassigned" : "All assigned ✓"; l.className = "left" + (c.unassigned >= 0.5 ? "" : " ok");
  }

  /* ---- events ---- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.id === "plus") return setCount(S.n + 1);
    if (t.id === "minus") return setCount(S.n - 1);
    var card = t.closest(".dish");
    if (card) {
      var it = items[+card.dataset.id];
      if (t.dataset.p != null) { var p = +t.dataset.p, ids = sharesOf(it); ids = it.shares[p] != null ? ids.filter(function (x) { return x !== p; }) : ids.concat(p); it.shares = evenShares(ids.sort(function (a, b) { return a - b; })); }
      else if (t.dataset.all) { var every = []; for (var k = 0; k < S.n; k++) every.push(k); it.shares = sharesOf(it).length === S.n ? {} : evenShares(every); }
      else if (t.dataset.open) it.open = !it.open;
      else if (t.dataset.even) it.shares = evenShares(sharesOf(it).sort(function (a, b) { return a - b; }));
      else return;
      paintDish(it); paintAll(); return;
    }
    if (t.dataset.pct != null) { S.tipMode = "pct"; S.tipPct = +t.dataset.pct; $("#tipamt").value = ""; $$("#presets button").forEach(function (b) { b.setAttribute("aria-pressed", b === t); }); return paintAll(); }
    if (t.id === "swTax") { S.taxFollows = !S.taxFollows; t.setAttribute("aria-checked", S.taxFollows); return paintAll(); }
    if (t.id === "swTip") { S.tipFollows = !S.tipFollows; t.setAttribute("aria-checked", S.tipFollows); return paintAll(); }
    if (t.id === "copy") return copyText(summaryText(compute()), t);
    if (t.dataset.copyp != null) return copyText(personText(compute(), +t.dataset.copyp), t);
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset.i != null) { // rename: update labels in place so typing keeps focus
      var i = +t.dataset.i; S.names[i] = t.value;
      var ch = (t.value.trim() || "G").charAt(0).toUpperCase();
      $$('[data-avp="' + i + '"]').forEach(function (a) { a.textContent = ch; });
      $$("#sDishes .chip[data-p='" + i + "'] .t").forEach(function (a) { a.textContent = nm(i); });
      $$('[data-who="' + i + '"]').forEach(function (a) { a.textContent = nm(i); });
      $$('[data-copyp="' + i + '"]').forEach(function (a) { a.textContent = "Copy " + nm(i) + "'s breakdown"; });
      items.forEach(paintDish); paintAll(); return;
    }
    if (t.dataset.sl != null) { var it = items[+t.closest(".dish").dataset.id]; setShare(it, +t.dataset.sl, +t.value); syncSliders(it); paintAll(); return; }
    if (t.id === "tipamt") { S.tipMode = "amt"; S.tipAmtCents = parseMoney(t.value); $$("#presets button").forEach(function (b) { b.setAttribute("aria-pressed", "false"); }); paintAll(); }
    if (t.id === "taxamt") { S.taxCents = parseMoney(t.value); paintAll(); }
  });

  renderPeople(); renderDishes(); renderTip(); renderTotals(); paintAll();
})();
</script>
