<style>
/* Layout: three pages behind a bottom tab bar (People · Bills · Who pays who). One night = shared people + many bills + one answer. Cool white ground, indigo accent, vivid person colors. */
:root {
  --bg: #f4f6fc;
  --surface: #ffffff;
  --surface-2: #eaeefa;
  --ink: #131a33;
  --muted: #535e7d;
  --line: #dce2f3;
  --accent: #3d5afe;
  --accent-ink: #ffffff;
  --accent-soft: #e0e6ff;
  --warn: #c2410c;
  --warn-soft: #ffe9dd;
  --ok: #0b8a5f;
  --ok-soft: #dcf5ea;
  --pl: 47%;
  --ps: 68%;
  --pt: #ffffff;
  --shadow: 0 1px 2px rgba(19,26,51,.05), 0 8px 22px rgba(61,90,254,.08);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1226; --surface: #161d38; --surface-2: #202849; --ink: #eef1ff; --muted: #a3add6; --line: #2b3562;
    --accent: #8c9eff; --accent-ink: #0d1226; --accent-soft: #28326b; --warn: #ffa45c; --warn-soft: #3d2a18; --ok: #4fd8a1; --ok-soft: #133a2d;
    --pl: 66%; --ps: 78%; --pt: #0d1226; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1226; --surface: #161d38; --surface-2: #202849; --ink: #eef1ff; --muted: #a3add6; --line: #2b3562;
  --accent: #8c9eff; --accent-ink: #0d1226; --accent-soft: #28326b; --warn: #ffa45c; --warn-soft: #3d2a18; --ok: #4fd8a1; --ok-soft: #133a2d;
  --pl: 66%; --ps: 78%; --pt: #0d1226; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { overflow-x: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45; padding-inline: 16px; -webkit-tap-highlight-color: transparent; }

button { font: inherit; color: inherit; cursor: pointer; }
input { font-size: max(16px, 1em); }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
#app { max-width: 600px; margin: 0 auto; padding-block: 14px 120px; }
.page { animation: in .3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.95) translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes bump { 0% { transform: scale(.85); } 100% { transform: scale(1); } }

/* type */
.brand { font: 700 13px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font: 800 32px/1.05 var(--f-display); letter-spacing: -.03em; margin: 4px 0 6px; text-wrap: balance; }
h2 { font: 800 21px/1.15 var(--f-display); letter-spacing: -.01em; margin: 0 0 4px; }

.sec { font: 700 12px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 18px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.gap { height: 14px; }

/* buttons */
.primary { width: 100%; border: none; border-radius: 16px; padding: 16px; background: var(--accent); color: var(--accent-ink); font: 700 17px var(--f-body); transition: transform .15s; }
.primary:active, .ghost:active, .bigbtn:active { transform: scale(.97); }
.ghost { width: 100%; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; background: var(--surface); font: 700 16px var(--f-body); }
.linkbtn { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 15px; padding: 6px 2px; }
.dangerlink { background: none; border: none; color: var(--warn); font-weight: 700; font-size: 15px; padding: 10px 2px; }
.back { background: none; border: none; color: var(--accent); font: 700 16px var(--f-body); padding: 4px 0; margin-bottom: 4px; }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; }
.icon { flex: none; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.icon svg { width: 16px; height: 16px; }
.icon:active { transform: scale(.88); }
.toolbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 14px; font: 700 14px var(--f-body); color: var(--ink); cursor: pointer; }
.toolbtn svg { width: 18px; height: 18px; }
.toolbtn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* avatars + chips */
.av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; background: hsl(var(--h) var(--ps) var(--pl)); color: var(--pt); font: 700 15px var(--f-body); }
.av.lg { width: 44px; height: 44px; font-size: 19px; }
.av.server { background: var(--surface-2); color: var(--ink); }
.dot { width: 11px; height: 11px; border-radius: 50%; background: hsl(var(--h) var(--ps) var(--pl)); display: inline-block; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; align-items: center; gap: 7px; padding: 5px 13px 5px 5px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 15px; font-weight: 500; transition: transform .15s, background .2s, border-color .2s; max-width: 100%; }
.chip .av { width: 28px; height: 28px; font-size: 13px; }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12ch; }
.chip:active { transform: scale(.93); }
.chip[aria-pressed="true"] { background: hsl(var(--h) var(--ps) var(--pl) / .18); border-color: hsl(var(--h) var(--ps) var(--pl)); animation: bump .3s cubic-bezier(.3,1.6,.5,1); }
.chip.plain { padding: 5px 15px; color: var(--muted); }
.chip.plain[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }

/* people page */
.prow { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); animation: pop .3s both; }
.prow:last-child { border-bottom: none; }
.prow input { flex: 1; min-width: 0; font: 500 18px var(--f-body); background: transparent; color: var(--ink); border: none; outline: none; padding: 8px 2px; border-bottom: 2px solid transparent; }
.prow input:focus { border-bottom-color: var(--accent); }
.prow input.venmo { font-size: 15px; color: var(--muted); }

/* bills list */
.billcard { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 16px 18px; animation: pop .35s both; }
.billcard:active { transform: scale(.98); }
.billcard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.billcard .ttl { font: 800 20px var(--f-display); min-width: 0; overflow-wrap: anywhere; }
.billcard .amt { font: 500 20px var(--f-mono); }
.billcard .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; font-size: 15px; color: var(--muted); flex-wrap: wrap; }
.status { font: 700 13px var(--f-body); border-radius: 999px; padding: 4px 10px; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.todo { background: var(--warn-soft); color: var(--warn); }
.track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.fill { height: 100%; background: var(--ok); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.nightbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 4px 4px 0; }
.nightbar span { font-weight: 700; }
.nightbar b { font: 500 24px var(--f-mono); }

.titlein { width: 100%; font: 800 30px/1.1 var(--f-display); letter-spacing: -.02em; background: transparent; color: var(--ink); border: none; border-bottom: 2px dashed var(--line); outline: none; padding: 4px 0 6px; margin: 2px 0 10px; }
.titlein:focus { border-bottom-color: var(--accent); }
.totalline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.totalline span { color: var(--muted); font-size: 15px; }
.totalline b { font: 500 28px var(--f-mono); }
.step { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; }
.step .n { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 16px var(--f-display); flex: none; }
.step h2 { margin: 0; }
.explain { background: var(--surface-2); border-radius: 12px; padding: 11px 13px; font-size: 15px; }
.prog { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); gap: 8px; }

.tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
.item { padding: 16px; transition: border-color .25s, box-shadow .3s; }
.item.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.item.flash { box-shadow: 0 0 0 4px var(--warn); }
.ihead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.iname { font: 700 19px var(--f-display); min-width: 0; overflow-wrap: anywhere; }
.iprice { font: 500 19px var(--f-mono); flex: none; }
.imeta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 2px 0 12px; min-height: 34px; }
.qty { font: 500 13px var(--f-mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; }
.icons { display: flex; gap: 6px; margin-left: auto; }
.bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--line); gap: 2px; margin-top: 12px; }
.bar i { display: block; height: 100%; background: hsl(var(--h) var(--ps) var(--pl)); transition: width .35s cubic-bezier(.2,.8,.2,1); }
.tbl { display: grid; grid-template-columns: 1fr auto auto; column-gap: 18px; row-gap: 8px; margin-top: 12px; align-items: center; }
.tbl .who { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 16px; }
.tbl .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl .pc { font: 400 14px var(--f-mono); color: var(--muted); text-align: right; }
.tbl .am { font: 500 16px var(--f-mono); text-align: right; }
.warnline { color: var(--warn); font-weight: 700; font-size: 15px; margin-top: 2px; }
.sliders { display: grid; gap: 12px; margin-top: 10px; padding-top: 12px; border-top: 1px dashed var(--line); }
.srow .lab { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
.srow .lab .pc { margin-left: auto; font: 500 15px var(--f-mono); }
.srow .lab .am { font: 400 13px var(--f-mono); color: var(--muted); min-width: 6ch; text-align: right; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; --c: var(--accent); }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: linear-gradient(to right, var(--c) var(--p,0%), var(--line) var(--p,0%)); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--c); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c); margin-top: -10px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c); }
.textin { width: 100%; min-width: 0; font: 500 16px var(--f-body); background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; outline: none; }
.textin:focus, .qtybox input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.addrow { display: flex; gap: 10px; align-items: center; }
.money { display: flex; align-items: center; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 12px; width: 150px; }
.addrow .money { width: auto; flex: 1; }
.money:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.money span { color: var(--muted); font-family: var(--f-mono); }
.money input { border: none; background: transparent; color: var(--ink); font: 500 18px var(--f-mono); padding: 11px 6px; width: 100%; min-width: 0; outline: none; text-align: right; }
.qtybox { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.qtybox input { width: 64px; text-align: center; font: 500 18px var(--f-mono); background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 4px; outline: none; }
.empty { text-align: center; color: var(--muted); padding: 22px 16px; }
.big { font: 500 38px/1 var(--f-mono); letter-spacing: -.02em; }
.presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.presets button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 12px 0; font: 700 16px var(--f-body); }
.presets button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.field { display: flex; align-items: center; gap: 10px; }
.field label { color: var(--muted); font-size: 15px; flex: 1; }
.switch { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: none; padding: 2px 0; }
.switch .txt { flex: 1; min-width: 0; }
.switch .txt b { display: block; font-weight: 700; font-size: 16px; }
.switch .txt small { color: var(--muted); font-size: 13px; }
.tg { width: 52px; height: 32px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .25s; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
.switch[aria-checked="true"] .tg { background: var(--accent); }
.switch[aria-checked="true"] .tg::after { transform: translateX(20px); }
hr { border: none; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }

/* results */
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 15px; font-weight: 700; }
.warnbox button { margin-top: 6px; display: block; color: inherit; text-decoration: underline; }
.line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 16px; }
.line:last-child { border-bottom: none; }
.line b { font: 500 16px var(--f-mono); white-space: nowrap; }
.line small { display: block; color: var(--muted); font-size: 13px; }
.line.total { border-top: 2px solid var(--line); border-bottom: none; margin-top: 4px; padding-top: 12px; font-weight: 700; }
.line.total b { font-size: 19px; }
.pay { padding: 16px 18px; animation: pop .4s cubic-bezier(.3,1.4,.5,1) both; }
.pay .pr { display: flex; align-items: center; gap: 10px; }
.pay .arrow { color: var(--muted); font: 700 22px var(--f-body); }
.pay .pr b { margin-left: auto; font: 500 30px var(--f-mono); letter-spacing: -.02em; }
.pay .words { margin-top: 10px; font-size: 19px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pay .words a { font-size: 15px; color: var(--accent); font-weight: 700; }
.allsquare { text-align: center; padding: 20px; font: 700 18px var(--f-display); color: var(--ok); }
.person { padding: 0; overflow: hidden; }
.person .phead { display: flex; align-items: center; gap: 12px; padding: 16px 18px; background: hsl(var(--h) var(--ps) var(--pl) / .10); }
.person .phead h3 { font: 800 22px var(--f-display); margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.person .res { text-align: right; }
.person .res small { display: block; font: 700 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.person .res b { font: 500 24px var(--f-mono); }
.person .res.back small, .person .res.back b { color: var(--ok); }
.person .pbody { padding: 14px 18px 18px; }
.person .sentence { font-size: 17px; margin: 0 0 10px; }
.person .billhdr { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 16px 0 2px; padding: 8px 12px; background: var(--surface-2); border-radius: 10px; font-weight: 700; }
.person .billhdr b { font: 500 16px var(--f-mono); }
.person .line { padding-inline: 4px; }
.person .final { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-weight: 700; }
.person .final.back { background: var(--ok-soft); }
.person .final b { font: 500 20px var(--f-mono); }
.minus { color: var(--ok); }
.copybox { margin: 0; white-space: pre-wrap; font: 400 13px var(--f-mono); background: var(--surface-2); border-radius: 12px; padding: 12px; max-height: 300px; overflow: auto; }
#shareimg { width: 100%; border-radius: 14px; border: 1px solid var(--line); display: block; }

/* tab bar, toast */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(19,26,51,.08); padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabbar .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); padding-inline: 8px; }
.tabbar button { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; color: var(--muted); font: 700 13px var(--f-body); position: relative; }
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button[aria-current="page"] { color: var(--accent); }
.tabbar .badge { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--warn); color: #fff; font: 700 11px/18px var(--f-body); padding: 0 5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); width: max-content; max-width: calc(100% - 32px); }
.toast span { font-size: 15px; }
.toast button { border: none; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 8px 14px; font: 700 14px var(--f-body); flex: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

  function copyText(txt, btn) {

  /* ================= picture export ================= */
  var lastCanvas = null, shareTimer = null;
  function paintShare() {

    var A = calcAll();
    $("#shareChips").innerHTML = '<button class="chip plain" data-sw="all" aria-pressed="' + (st.shareWho === "all") + '">Everyone</button>' +
      people.map(function (p) { return '<button class="chip" data-sw="' + p.id + '" style="--h:' + hueOf(p.id) + '" aria-pressed="' + (st.shareWho === p.id) + '">' + av(p.id) + '<span class="t">' + esc(nm(p.id)) + "</span></button>"; }).join("");
    try { lastCanvas = drawPicture(A, st.shareWho); img.src = lastCanvas.toDataURL("image/png"); } catch (e) {}
  }
  function drawPicture(A, who) {
    var W = 1080, P = 48, IW = W - P * 2, L = P + 32, R = P + IW - 32;
    var SANS = '"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif', MONO = '"DM Mono", ui-monospace, Menlo, monospace';
    var INK = "#131a33", MUTED = "#535e7d", LINE = "#dce2f3", ACC = "#3d5afe", OK = "#0b8a5f", SOFT = "#eaeefa";
    var ops = [], y = 0, g = null;
    function op(f) { ops.push(f); }
    function col(id) { return id === "server" ? "#8892b0" : "hsl(" + hueOf(id) + " 68% 47%)"; }
    function rr(x, yy, w, h, r) { g.beginPath(); g.moveTo(x + r, yy); g.arcTo(x + w, yy, x + w, yy + h, r); g.arcTo(x + w, yy + h, x, yy + h, r); g.arcTo(x, yy + h, x, yy, r); g.arcTo(x, yy, x + w, yy, r); g.closePath(); }
    function text(t, x, yy, font, color, align) { g.font = font; g.fillStyle = color; g.textAlign = align || "left"; g.textBaseline = "alphabetic"; g.fillText(t, x, yy); }
    function fit(t, font, maxW) { g.font = font; while (t.length > 1 && g.measureText(t).width > maxW) t = t.slice(0, -2) + "…"; return t; }
    function circ(x, yy, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, yy, r, 0, 6.2832); g.fill(); }
    function card(h, draw) { var top = y; op(function () { g.fillStyle = "#fff"; rr(P, top, IW, h, 28); g.fill(); g.strokeStyle = LINE; g.lineWidth = 2; g.stroke(); draw(top); }); y += h + 24; }
    function row(top, i, left, right, opt) { opt = opt || {}; var yy = top + i; op(function () {
      if (opt.dot) circ(L + 14, yy - 11, 14, opt.dot);
      text(fit(left, (opt.bold ? "700 " : "500 ") + (opt.size || 32) + "px " + SANS, IW - 330), L + (opt.dot ? 40 : 0), yy, (opt.bold ? "700 " : "500 ") + (opt.size || 32) + "px " + SANS, opt.color || INK);
      if (right) text(right, R, yy, (opt.bold ? "700 " : "500 ") + (opt.size || 32) + "px " + MONO, opt.rcolor || opt.color || INK, "right");
      if (opt.sub) text(fit(opt.sub, "400 24px " + SANS, IW - 80), L + (opt.dot ? 40 : 0), yy + 32, "400 24px " + SANS, MUTED);
    }); }

      text(money(who === "all" ? A.total : Math.abs(net)), P, 276, "500 108px " + MONO, "#fff");
      if (who === "all") text("total", W - P, 276, "500 34px " + SANS, "rgba(255,255,255,.85)", "right");
    });
    y = 370;
    var xs = A.xfers.filter(function (x) { return who === "all" || x.from === who || x.to === who; });
    card(96 + Math.max(1, xs.length) * 70, function (top) {
      op(function () { text("PAYMENTS" + (st.roundUp ? " (ROUNDED UP)" : ""), L, top + 54, "700 26px " + SANS, MUTED); });
      if (!xs.length) row(top, 120, "Everyone is all square", "", { color: OK });
      xs.forEach(function (x, k) { row(top, 120 + k * 70, nm(x.from) + "  →  " + nm(x.to), money(shownAmt(x.amt)), { dot: col(x.from), bold: true, rcolor: ACC }); });
    });
    // ops pushed inside card() run later, so nested rows need to be added in order: flatten by running card draws now
    if (who === "all") {
      card(96 + A.ids.length * 76, function (top) {
        op(function () { text("EACH PERSON", L, top + 54, "700 26px " + SANS, MUTED); });
        A.ids.forEach(function (id, k) { var n2 = netShown(A, id); row(top, 120 + k * 76, nm(id), Math.abs(n2) < 1 ? "square" : (n2 < 0 ? "gets " : "pays ") + money(Math.abs(n2)), { dot: col(id), bold: true, rcolor: n2 < 0 ? OK : INK, sub: "part of everything " + money(A.share[id]) + (A.paid[id] ? " · paid " + money(A.paid[id]) : "") }); });
      });
      A.bills.forEach(function (x) {
        var b = x.b, c = x.c, h = 140, rows = [];
        b.items.forEach(function (it) { var sp = itemSplit(it), ids = sharers(it); rows.push({ it: it, sp: sp, ids: ids }); h += 58 + ids.length * 42; });
        h += 70 + 4 * 48;
        card(h, function (top) {
          row(top, 64, billName(b), money(c.grand), { bold: true, size: 36 });
          op(function () { text(b.payer != null && person(b.payer) ? "paid by " + nm(b.payer) : "not paid yet", L, top + 104, "400 26px " + SANS, MUTED); });
          var yy = 160;
          rows.forEach(function (r) {
            row(top, yy, r.it.name + (r.it.qty > 1 ? " ×" + r.it.qty : ""), money(r.it.price), { bold: true, size: 30 }); yy += 46;
            r.ids.forEach(function (id) { var yv = yy, pct = r.ids.length > 1 ? pcs(r.it.shares[id]) : ""; op(function () { circ(L + 22, top + yv - 9, 10, col(id)); text(nm(id), L + 42, top + yv, "500 27px " + SANS, MUTED); if (pct) text(pct, R - 190, top + yv, "500 27px " + MONO, MUTED, "right"); text(money(r.sp[id]), R, top + yv, "500 27px " + MONO, MUTED, "right"); }); yy += 42; });
            yy += 12;
          });
          var ys = yy + 10; op(function () { g.fillStyle = LINE; g.fillRect(L, top + ys, IW - 64, 2); });
          [["Subtotal", c.sub], ["Tax", c.tax], ["Tip", c.tip]].forEach(function (r, k) { row(top, ys + 48 + k * 48, r[0], money(r[1]), { color: MUTED, size: 28 }); });
          row(top, ys + 48 + 3 * 48, "Total", money(c.grand), { bold: true, size: 30 });
        });
      });
    } else {
      A.bills.forEach(function (x) {
        var b = x.b, c = x.c; if (!c.share[who]) return;
        var its = b.items.filter(function (it) { return itemSplit(it)[who]; });
        var h = 110 + its.length * 82 + (c.taxO[who] ? 60 : 0) + (c.tipO[who] ? 60 : 0) + 90;
        card(h, function (top) {
          row(top, 64, billName(b), "", { bold: true, size: 34 });
          var yy = 130;
          its.forEach(function (it) { row(top, yy, it.name + (it.qty > 1 ? " ×" + it.qty : ""), money(itemSplit(it)[who]), { sub: splitWords(it, who) + " · " + money(it.price) + " total" }); yy += 82; });

          if (c.tipO[who]) { row(top, yy, "Tip", money(c.tipO[who]), { color: MUTED }); yy += 60; }

      card(96 + 70 + paidBills.length * 70 + 86, function (top) {

        row(top, 120, "Part of everything", money(A.share[who]), { bold: true });
        paidBills.forEach(function (x, k) { row(top, 190 + k * 70, "Paid the " + (x.b.title || "bill") + " bill", "-" + money(x.c.grand), { color: OK }); });
        var yf = 190 + paidBills.length * 70 + 20;
        op(function () { g.fillStyle = SOFT; rr(L - 12, top + yf - 46, IW - 40, 66, 14); g.fill(); });
        row(top, yf, Math.abs(net) < 1 ? "All square" : net < 0 ? "Gets back" : "Pays", money(Math.abs(net)), { bold: true, rcolor: net < 0 ? OK : ACC });

  }
  function copyImage(btn) {
    var note = $("#imgNote"), ok = function () { var o = btn.textContent; btn.textContent = "Copied!"; setTimeout(function () { btn.textContent = o; }, 1600); },
      fail = function () { note.style.color = "var(--warn)"; note.textContent = "Copying is blocked here. Press and hold the picture, then tap Copy or Save."; };
    if (!lastCanvas) return;

  /* ================= render ================= */
  function render() {
    var A = calcAll(), b = st.tab === "bills" && st.open != null ? bill(st.open) : null, html;

    renderTabs(A);
    save();
  }
  function curBill() { return st.tab === "bills" && st.open != null ? bill(st.open) : null; }

  /* ================= events ================= */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    var b = curBill();

      bills.forEach(function (bb) {
        if (bb.payer === pid) bb.payer = null;
        bb.items.forEach(function (it) { if (it.shares[pid] == null) return; delete it.shares[pid]; var ids = Object.keys(it.shares), z = ids.reduce(function (a, k) { return a + it.shares[k]; }, 0); ids.forEach(function (k) { it.shares[k] = z ? it.shares[k] * 100 / z : 100 / ids.length; }); });
      });

      if (t.id === "clearAll") { if (!b.items.length) return; snap("Cleared all names."); b.items.forEach(function (it) { it.shares = {}; it.open = false; }); paintItems(b); paintBillNumbers(b); return save(); }

      if (t.id === "swTaxEven") { b.taxEven = !b.taxEven; t.setAttribute("aria-checked", b.taxEven); paintBillNumbers(b); return save(); }

        if (t.dataset.p != null) { var id = +t.dataset.p, ids = sharers(it); ids = it.shares[id] != null ? ids.filter(function (x) { return x !== id; }) : ids.concat(id); it.shares = evenShares(people.map(function (p) { return p.id; }).filter(function (x) { return ids.indexOf(x) >= 0; })); if (sharers(it).length < 2) it.open = false; }
        else if (t.dataset.all) { it.shares = sharers(it).length === people.length ? {} : evenShares(people.map(function (p) { return p.id; })); it.open = false; }
        else if (t.dataset.open) it.open = !it.open;

    if (t.dataset.copyp) return copyText(personText(calcAll(), +t.dataset.copyp), t);
    if (t.dataset.sw) { st.shareWho = t.dataset.sw === "all" ? "all" : +t.dataset.sw; save(); return paintShare(); }
    if (t.id === "copyImg") return copyImage(t);
    if (t.id === "saveImg") return saveImage(t);
  });
  document.addEventListener("input", function (e) {

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then(function (s) { if (!s) return; sampleFn = s; return s.limits().then(function (lim) { if (lim && lim.images) { canImages = true; if (st.tab === "bills" && st.open == null) render(); } }, function () {}); }, function () {});
    window.claude.use("downloads").then(function (d) { if (d) { dlFn = d; if (st.tab === "results") render(); } }, function () {});
  }
})();
