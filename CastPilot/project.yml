# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: CastPilot
options:
  bundleIdPrefix: com.castpilot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CastPilot:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: CastPilot
        PRODUCT_BUNDLE_IDENTIFIER: com.castpilot.app   # change to something unique, e.g. com.yourname.castpilot
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""   # pick your team in Xcode > Signing & Capabilities
    scheme: {}
