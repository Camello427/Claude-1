name: Publish CastPilot web app

# Publishes CastPilotWeb/ to GitHub Pages. One-time setup in the repository:
# Settings > Pages > Build and deployment > Source: "GitHub Actions".
# (GitHub Pages needs a public repository, or a paid GitHub plan for private ones.)

on:
  push:
    branches: [main]
    paths:
      - "CastPilotWeb/**"
      - ".github/workflows/castpilot-web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: CastPilotWeb
      - id: deployment
        uses: actions/deploy-pages@v4
